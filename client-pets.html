<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Pets — Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     CLIENT MY PETS — page-scoped styles only (style.css untouched).
     Reuses the same design tokens/patterns already established in
     client-dashboard.html (dash-card, pet-row, status-badge, etc.)
     rather than inventing a new visual language.
     ============================================================ */

  .page-intro { margin-bottom: 18px; }
  .page-intro-title { font-size: 22px; font-weight: 800; color: var(--ink-900); margin-bottom: 4px; }
  .page-intro-sub { font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }

  .pets-card {
    background: var(--surface-card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--clay-flat);
    padding: 6px 18px;
  }

  .pet-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line-soft);
    flex-wrap: wrap;
  }
  .pet-list-row:last-child { border-bottom: none; }

  .pet-list-main { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .pet-list-avatar {
    width: 40px; height: 40px; border-radius: var(--r-sm);
    background: var(--teal-50); color: var(--teal-700);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .pet-list-name { font-weight: 800; color: var(--ink-900); font-size: 13.6px; }
  .pet-list-meta { font-size: 11.6px; color: var(--ink-faint); font-weight: 600; }

  .pet-list-cols { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .pet-list-col { min-width: 90px; }
  .pet-list-col-label { font-size: 10.4px; color: var(--ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .pet-list-col-value { font-size: 12.6px; color: var(--ink-800); font-weight: 700; }

  .empty-note { padding: 20px 0; color: var(--ink-faint); font-weight: 600; font-size: 12.6px; }

  /* ---- profile overlay ---- */

  .profile-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 60;
    background: rgba(20, 30, 30, 0.42);
    align-items: flex-start; justify-content: center;
    padding: 32px 16px;
    overflow-y: auto;
  }
  .profile-overlay.open { display: flex; }

  .profile-panel {
    background: var(--surface-card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--clay-flat);
    width: 100%;
    max-width: 720px;
    padding: 0;
    max-height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
  }

  .profile-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 20px 22px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .profile-head-main { display: flex; align-items: center; gap: 14px; }
  .profile-avatar {
    width: 52px; height: 52px; border-radius: var(--r-md);
    background: var(--teal-50); color: var(--teal-700);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .profile-name { font-size: 18px; font-weight: 800; color: var(--ink-900); }
  .profile-sub { font-size: 12.6px; color: var(--ink-faint); font-weight: 600; margin-top: 2px; }
  .profile-close {
    border: 1px solid var(--line-soft); background: var(--surface-card-raised);
    color: var(--ink-800); border-radius: var(--r-sm); width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .profile-close:hover { border-color: var(--teal-400); color: var(--teal-700); }

  .profile-body { padding: 18px 22px 22px; overflow-y: auto; }

  .profile-section { margin-bottom: 20px; }
  .profile-section:last-child { margin-bottom: 0; }
  .profile-section-title {
    font-size: 12.4px; font-weight: 800; color: var(--ink-900);
    display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
  }
  .profile-section-title i { color: var(--teal-500); font-size: 11px; }

  .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
  .profile-field-label { font-size: 10.4px; color: var(--ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .profile-field-value { font-size: 12.8px; color: var(--ink-800); font-weight: 600; }

  .profile-list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.4px;
  }
  .profile-list-row:last-child { border-bottom: none; }
  .profile-list-main { font-weight: 700; color: var(--ink-800); }
  .profile-list-meta { color: var(--ink-faint); font-weight: 600; }

  .queue-inline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .queue-inline-code { font-size: 20px; font-weight: 800; color: var(--teal-700); }
  .queue-inline-label { font-size: 12.4px; font-weight: 700; color: var(--teal-700); }

  @media (max-width: 700px) {
    .profile-grid { grid-template-columns: 1fr; }
    .pet-list-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"><i class="fa-solid fa-paw"></i></div>
        <div class="brand-text">
          <div class="brand-name">Pawsitive Care</div>
          <div class="brand-role">Pet Owner</div>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">MAIN</div>
          <a href="client-dashboard.html" class="nav-item" data-page="client-dashboard.html">
            <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
            <span class="nav-label">Dashboard</span>
          </a>
          <a href="client-appointments.html" class="nav-item" data-page="client-appointments.html">
            <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
            <span class="nav-label">Appointments</span>
          </a>
          <a href="client-queue.html" class="nav-item" data-page="client-queue.html">
            <span class="nav-icon"><i class="fa-solid fa-hourglass-half"></i></span>
            <span class="nav-label">Queue</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">MY PETS</div>
          <a href="client-pets.html" class="nav-item active" data-page="client-pets.html">
            <span class="nav-icon"><i class="fa-solid fa-paw"></i></span>
            <span class="nav-label">My Pets</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">MEDICAL</div>
          <a href="client-medical-records.html" class="nav-item" data-page="client-medical-records.html">
            <span class="nav-icon"><i class="fa-solid fa-notes-medical"></i></span>
            <span class="nav-label">Medical Records</span>
          </a>
          <a href="client-vaccinations.html" class="nav-item" data-page="client-vaccinations.html">
            <span class="nav-icon"><i class="fa-solid fa-syringe"></i></span>
            <span class="nav-label">Vaccinations</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">ACCOUNT</div>
          <a href="client-notifications.html" class="nav-item" data-page="client-notifications.html">
            <span class="nav-icon"><i class="fa-solid fa-bell"></i></span>
            <span class="nav-label">Notifications</span>
          </a>
          <a href="client-billing.html" class="nav-item" data-page="client-billing.html">
            <span class="nav-icon"><i class="fa-solid fa-credit-card"></i></span>
            <span class="nav-label">Billing</span>
          </a>
          <a href="profile.html" class="nav-item" data-page="profile.html">
            <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
            <span class="nav-label">Profile</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-avatar" id="footer-avatar">?</div>
        <div>
          <div class="footer-name" id="footer-name">—</div>
          <div class="footer-role">Pet Owner</div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
          <div>
            <div class="topbar-title">My Pets</div>
            <div class="topbar-crumb">Pawsitive Care / My Pets</div>
          </div>
        </div>
      </header>

      <main class="page-body">

        <div class="page-intro">
          <div class="page-intro-title">My Pets</div>
          <div class="page-intro-sub">All pets registered under your account.</div>
        </div>

        <section class="pets-card">
          <div id="pets-list"></div>
        </section>

      </main>
    </div>
  </div>

  <!-- Read-only pet profile overlay. Populated entirely from real
       PCData records by client-pets.js — nothing here is hardcoded. -->
  <div class="profile-overlay" id="profile-overlay">
    <div class="profile-panel">
      <div class="profile-head">
        <div class="profile-head-main">
          <div class="profile-avatar" id="profile-avatar"><i class="fa-solid fa-paw"></i></div>
          <div>
            <div class="profile-name" id="profile-name">—</div>
            <div class="profile-sub" id="profile-sub">—</div>
          </div>
        </div>
        <button class="profile-close" id="profile-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="profile-body" id="profile-body"></div>
    </div>
  </div>

  <!-- Same load order as client-dashboard.html: data-store.js first
       (owns PCData), then patient-data-store.js (Patients +
       Vaccinations), then medical-records-data-store.js (Medical
       Records — attaches onto the same PCData object, same pattern),
       then the client session helper, then this page's own wiring. -->
  <script src="data-store.js"></script>
  <script src="patient-data-store.js"></script>
  <script src="medical-records-data-store.js"></script>
  <script src="client-session.js"></script>
  <script src="client-pets.js"></script>
</body>
</html>
