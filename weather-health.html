<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather & Health · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Weather & Health — page-scoped styles (wh- prefix). Same structure as the
     cleaned Medicine Demand / Disease Risk pages: title-only header, each major
     section is its own independent surface, inner content surfaces only for
     tables/lists and confidence tiles. Every color, border, shadow and radius
     uses existing style.css tokens. */

  /* Header: title only. The shared topbar only holds the hamburger, hidden
     above 980px, so collapse it on desktop (same as Medicine Demand). */
  .topbar { border-bottom: none; }
  @media (min-width: 981px) { .topbar { display: none; } }
  .wh-page-title { margin: 0 0 2px; font-size: 20px; font-weight: 800; line-height: inherit; letter-spacing: normal; color: var(--ink-900); }
  .wh-page-header { margin-bottom: 30px; }

  /* Each major section is its own independent surface; no page wrapper. */
  .wh-section { box-sizing: border-box; min-width: 0; padding: 16px 18px 18px; margin-bottom: 24px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  .wh-h2 { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }

  /* Wide-screen layout only (>= 1100px): #wh-root becomes a two-column grid.
     Every direct child spans both columns except the four .wh-half sections
     (Environmental Factors, Related Health Patterns, Weather & Health Context,
     Weather Trend), which take one column each. Below 1100px there is no grid
     and everything stacks. */
  @media (min-width: 1100px) {
    #wh-root { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; row-gap: 0; }
    #wh-root > * { grid-column: 1 / -1; min-width: 0; }
    #wh-root > .wh-half { grid-column: auto; }
  }

  .wh-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .wh-badge-nodata { background: transparent; color: var(--ink-700); border: 1px solid var(--line-strong); white-space: normal; text-align: center; line-height: 1.3; }
  .wh-empty { padding: 16px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); color: var(--ink-700); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }

  /* --- Current Conditions: main weather area (illustration left; temperature,
     condition, feels-like and location right) with three compact metric tiles
     below. Only existing style.css tokens are used. --- */
  .wh-cc { display: flex; flex-direction: column; gap: 14px; }
  .wh-cc-main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
  .wh-cc-art { position: relative; min-height: 190px; overflow: hidden; border-radius: var(--r-md); border: 1px solid var(--line-soft); background: var(--teal-50); }
  .wh-cc-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .wh-cc-art-fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; color: var(--sage-600); font-size: 44px; }
  .wh-cc-art.wh-cc-art-missing img { display: none; }
  .wh-cc-art.wh-cc-art-missing .wh-cc-art-fallback { display: flex; }
  .wh-cc-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .wh-cc-location { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-700); overflow-wrap: anywhere; }
  .wh-cc-location i { flex: none; color: var(--sage-600); font-size: 13px; }
  .wh-cc-temp { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--teal-700); overflow-wrap: anywhere; }
  .wh-cc-condition { margin-top: 4px; font-size: 20px; font-weight: 800; color: var(--ink-900); overflow-wrap: anywhere; }
  .wh-cc-feels { font-size: 13px; font-weight: 500; color: var(--ink-700); }
  .wh-cc-feels strong { font-weight: 700; color: var(--ink-800); }
  .wh-cc-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .wh-cc-tile { box-sizing: border-box; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-xs); }
  .wh-cc-tile-icon { flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-xs); background: var(--sage-100); color: var(--sage-600); font-size: 13px; }
  .wh-cc-tile-body { min-width: 0; }
  .wh-cc-tile-label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-700); overflow-wrap: anywhere; }
  .wh-cc-tile-value { margin-top: 2px; font-size: 16px; font-weight: 800; line-height: 1.15; color: var(--teal-700); overflow-wrap: anywhere; }
  @media (max-width: 720px) {
    .wh-cc-main { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .wh-cc-art { min-height: 0; aspect-ratio: 5 / 2; }
    .wh-cc-temp { font-size: 44px; }
  }
  @media (max-width: 420px) {
    .wh-cc-tiles { grid-template-columns: minmax(0, 1fr); }
  }
  /* --- Inner content surface for tables / lists (page-bg tone, hairline
     border, faint inset), same as Medicine Demand's tables. --- */
  .wh-table-wrap, .wh-patterns-list, .wh-ctx-list { position: relative; background: var(--surface-bg); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: inset 0 1px 2px rgba(31, 42, 46, 0.05); }
  .wh-table-wrap { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }

  /* Environmental Factors table */
  .wh-table { width: 100%; min-width: 340px; border-collapse: collapse; font-size: 12.5px; }
  .wh-table thead th { text-align: left; padding: 10px 8px; font-size: 10.6px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-700); background: var(--surface-sunken); border-bottom: 1px solid transparent; }
  .wh-table thead th:first-child { padding-left: 12px; border-top-left-radius: var(--r-xs); border-bottom-left-radius: var(--r-xs); }
  .wh-table thead th:last-child { padding-right: 12px; border-top-right-radius: var(--r-xs); border-bottom-right-radius: var(--r-xs); }
  .wh-table tbody td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; color: var(--ink-900); }
  .wh-table tbody td:first-child { padding-left: 12px; }
  .wh-table tbody td:last-child { padding-right: 12px; }
  .wh-table tbody tr:last-child td { border-bottom: none; }
  .wh-table tbody tr:hover { background: var(--surface-sunken); }
  .wh-factor-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-900); }
  .wh-factor-name i { flex: none; color: var(--ink-soft); font-size: 12px; }
  .wh-relevance-text { font-size: 12.5px; font-weight: 500; line-height: 1.45; color: var(--ink-700); overflow-wrap: break-word; }
  @media (max-width: 560px) { .wh-table { min-width: 420px; } }

  /* Related Health Patterns */
  .wh-patterns-list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .wh-pattern-row { box-sizing: border-box; min-width: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .wh-patterns-list > .wh-pattern-row:last-child { border-bottom: none; }
  .wh-pattern-cat { display: flex; align-items: center; gap: 10px; min-width: 0; margin-bottom: 10px; }
  .wh-pattern-icon { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--teal-50); color: var(--teal-700); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .wh-pattern-name { font-size: 13px; font-weight: 800; color: var(--ink-900); line-height: 1.3; overflow-wrap: anywhere; }
  .wh-pattern-sublabel { margin-top: 1px; font-size: 11px; font-weight: 500; color: var(--ink-soft); line-height: 1.3; }
  .wh-pattern-fields { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .wh-pattern-field { display: grid; grid-template-columns: minmax(88px, 118px) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
  .wh-pattern-field dt { margin: 0; font-size: 10.4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  .wh-pattern-field dd { margin: 0; min-width: 0; font-size: 12.5px; font-weight: 500; line-height: 1.45; color: var(--ink-800); overflow-wrap: break-word; }

  /* Weather & Health Context: Environmental Factor / Observed Health Pattern /
     Prediction Context. Cells wrap on their own, so one rule fits half-width
     and full-width layouts. */
  .wh-ctx-list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .wh-ctx-row { box-sizing: border-box; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .wh-ctx-list > .wh-ctx-row:last-child { border-bottom: none; }
  .wh-ctx-cell { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .wh-ctx-cell-label { font-size: 10.4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  .wh-ctx-cell-value { font-size: 12.8px; font-weight: 600; color: var(--ink-900); overflow-wrap: anywhere; }
  .wh-ctx-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--r-pill); font-size: 11px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; background: var(--sage-100); color: var(--sage-600); }

  /* Weather Trend: honest unavailable state (no historical weather store) */
  .wh-trend-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; min-height: 160px; padding: 24px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); }
  .wh-trend-empty-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-card); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .wh-trend-empty-text { margin: 0; max-width: 320px; font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--ink-700); }

  /* Data Confidence tiles — same treatment as Medicine Demand's Demand Confidence */
  .wh-confidence-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .wh-confidence-card { box-sizing: border-box; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-xs); }
  .wh-confidence-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .wh-confidence-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .wh-confidence-dot.wh-dot-high { background: var(--teal-700); }
  .wh-confidence-dot.wh-dot-medium { background: var(--amber-600); }
  .wh-confidence-dot.wh-dot-low { background: var(--red-600); }
  .wh-confidence-dot.wh-dot-insufficient { background: transparent; border: 1.5px solid var(--ink-soft); }
  .wh-confidence-label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-800); overflow-wrap: anywhere; }
  .wh-confidence-count { margin-top: 8px; font-size: 22px; font-weight: 800; color: var(--ink-900); line-height: 1.1; }
  .wh-confidence-unit { font-size: 11px; font-weight: 500; color: var(--ink-700); }
  .wh-confidence-note { margin: 12px 0 0; font-size: 12px; font-weight: 500; line-height: 1.5; color: var(--ink-700); }
  @media (max-width: 900px) { .wh-confidence-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Analysis Note */
  .wh-note { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); }
  .wh-note-icon { flex: none; margin-top: 2px; color: var(--teal-700); font-size: 14px; }
  .wh-note > div:last-child { min-width: 0; }
  .wh-note-title { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--ink-800); }
  .wh-note-text { margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.55; color: var(--ink-700); }

  @media (max-width: 480px) { .wh-section { padding: 14px 12px 16px; } }
</style>
</head>
