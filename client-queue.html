<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue — Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     CLIENT QUEUE — page-scoped styles only (style.css untouched).
     Reuses the same design tokens as client-dashboard.html/
     client-pets.js (--ink-*, --teal-*, --surface-card, --r-*,
     --clay-flat, --line-soft) and the app's global .live-banner /
     .live-dot / .status-badge / .btn classes already used on the
     Administrator Queue page (queue.html), so this page matches
     the existing design system instead of introducing a new one.
     ============================================================ */

  .queue-page-title { font-size: 20px; font-weight: 800; margin-bottom: 2px; color: var(--ink-900); }
  .queue-page-date { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

  .queue-toolbar { margin-bottom: 14px; }

  /* Now Serving mini strip — context only, no identifying details
     about other clients' pets, and no action buttons (read-only). */
  .now-serving-mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-card); border: 1px solid var(--line-soft);
    border-radius: var(--r-md); padding: 12px 16px; margin-bottom: 18px;
    box-shadow: var(--clay-flat);
  }
  .now-serving-mini-label { font-size: 11.5px; font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
  .now-serving-mini-code { font-size: 20px; font-weight: 800; color: var(--teal-700); }
  .now-serving-mini-empty { font-size: 12.6px; color: var(--ink-soft); font-weight: 600; }

  .your-queue-heading { font-size: 13.2px; font-weight: 800; color: var(--ink-900); margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; }
  .your-queue-heading i { color: var(--teal-500); font-size: 12px; }

  .queue-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 18px; }

  .your-queue-card {
    background: var(--surface-card); border: 1px solid var(--line-soft);
    border-radius: var(--r-lg); box-shadow: var(--clay-flat);
    padding: 20px 22px;
  }
  .your-queue-card.is-called { border-color: var(--teal-400); }

  .yq-code { font-size: 34px; font-weight: 800; color: var(--teal-700); line-height: 1; margin-bottom: 6px; }
  .yq-pet { font-size: 15px; font-weight: 800; color: var(--ink-900); margin-bottom: 2px; }
  .yq-meta { font-size: 12.4px; color: var(--ink-faint); font-weight: 600; margin-bottom: 12px; }

  .yq-status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

  .turn-banner {
    background: var(--teal-50); border: 1px solid var(--teal-400);
    border-radius: var(--r-md); padding: 12px 14px; margin-top: 4px;
  }
  .turn-banner-title { font-size: 14.5px; font-weight: 800; color: var(--teal-700); margin-bottom: 2px; }
  .turn-banner-sub { font-size: 12.4px; color: var(--ink-800); font-weight: 600; }

  .yq-waiting-line { font-size: 12.8px; color: var(--ink-800); font-weight: 700; margin-top: 2px; }
  .yq-waiting-sub { font-size: 11.8px; color: var(--ink-faint); font-weight: 600; margin-top: 2px; }

  .queue-empty-state {
    background: var(--surface-card); border: 1px solid var(--line-soft);
    border-radius: var(--r-lg); box-shadow: var(--clay-flat);
    padding: 40px 20px; text-align: center;
  }
  .queue-empty-icon { font-size: 28px; color: var(--ink-faint); margin-bottom: 10px; }
  .queue-empty-title { font-size: 14.5px; font-weight: 800; color: var(--ink-900); margin-bottom: 4px; }
  .queue-empty-sub { font-size: 12.6px; color: var(--ink-soft); font-weight: 600; }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"><i class="fa-solid fa-paw"></i></div>
        <div class="brand-text">
          <div class="brand-name">Pawsitive Care</div>
          <div class="brand-role">Pet Owner</div>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">MAIN</div>
          <a href="client-dashboard.html" class="nav-item" data-page="client-dashboard.html">
            <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
            <span class="nav-label">Dashboard</span>
          </a>
          <a href="client-appointments.html" class="nav-item" data-page="client-appointments.html">
            <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
            <span class="nav-label">Appointments</span>
          </a>
          <a href="client-queue.html" class="nav-item active" data-page="client-queue.html">
            <span class="nav-icon"><i class="fa-solid fa-hourglass-half"></i></span>
            <span class="nav-label">Queue</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">MY PETS</div>
          <a href="client-pets.html" class="nav-item" data-page="client-pets.html">
            <span class="nav-icon"><i class="fa-solid fa-paw"></i></span>
            <span class="nav-label">My Pets</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">MEDICAL</div>
          <a href="client-medical-records.html" class="nav-item" data-page="client-medical-records.html">
            <span class="nav-icon"><i class="fa-solid fa-notes-medical"></i></span>
            <span class="nav-label">Medical Records</span>
          </a>
          <a href="client-vaccinations.html" class="nav-item" data-page="client-vaccinations.html">
            <span class="nav-icon"><i class="fa-solid fa-syringe"></i></span>
            <span class="nav-label">Vaccinations</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">ACCOUNT</div>
          <a href="client-notifications.html" class="nav-item" data-page="client-notifications.html">
            <span class="nav-icon"><i class="fa-solid fa-bell"></i></span>
            <span class="nav-label">Notifications</span>
          </a>
          <a href="client-billing.html" class="nav-item" data-page="client-billing.html">
            <span class="nav-icon"><i class="fa-solid fa-credit-card"></i></span>
            <span class="nav-label">Billing</span>
          </a>
          <a href="profile.html" class="nav-item" data-page="profile.html">
            <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
            <span class="nav-label">Profile</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-avatar" id="footer-avatar">?</div>
        <div>
          <div class="footer-name" id="footer-name">—</div>
          <div class="footer-role">Pet Owner</div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
          <div>
            <div class="topbar-title">Queue</div>
            <div class="topbar-crumb">Pawsitive Care / Queue</div>
          </div>
        </div>
      </header>

      <main class="page-body">

        <div class="page-toolbar queue-toolbar">
          <div>
            <div class="queue-page-title">MY QUEUE STATUS</div>
            <div class="queue-page-date" id="queue-date"></div>
          </div>
        </div>

        <div class="live-banner"><span class="live-dot"></span> Live — updates automatically as the clinic updates the queue</div>

        <div id="now-serving-mini"></div>

        <div id="queue-content"></div>

      </main>
    </div>
  </div>

  <!-- data-store.js first (owns PCData + the shared queue), then
       patient-data-store.js (owns getPatients/getPatientsForClient's
       pet lookups, needed to resolve this client's own pets), then
       the client session helper, then this page's own DOM wiring.
       This page is READ-ONLY: it never calls callNext/startConsultation/
       completeConsultation/removeFromQueue — only the existing getters. -->
  <script src="data-store.js"></script>
  <script src="patient-data-store.js"></script>
  <script src="client-session.js"></script>
  <script src="client-queue.js"></script>
</body>
</html>
