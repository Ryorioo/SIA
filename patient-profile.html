<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Profile · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     PATIENT PROFILE PAGE — page-scoped styles only (style.css
     untouched). Reuses the existing design tokens.
     ============================================================ */
  .topbar { border-bottom: none; }
  .page-body { overflow-x: clip; }

  /* quiet ghost/pill "go back" navigation control */
  .pp-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: var(--r-pill);
    background: var(--sage-50); color: var(--teal-700);
    font-size: 12.5px; font-weight: 700; line-height: 1.4;
    margin-bottom: 10px; transition: background-color 0.15s ease, color 0.15s ease;
  }
  .pp-back i { font-size: 11px; }
  .pp-back:hover { background: var(--sage-100); color: var(--teal-800); }
  .pp-title { font-size: 20px; font-weight: 800; color: var(--ink-900); letter-spacing: -0.01em; margin-bottom: 16px; }

  /* shared panel surface */
  .pp-panel {
    background: var(--surface-card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--clay-flat);
    padding: 20px 22px;
    min-width: 0;
  }
  .pp-panel-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 14.2px; font-weight: 800; color: var(--ink-900);
    margin-bottom: 16px;
  }
  .pp-panel-title i { color: var(--teal-600); font-size: 13.5px; }

  /* ---------- patient header ---------- */
  .pp-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px 24px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .pp-identity { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .pp-photo {
    width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
    background: var(--surface-sunken);
    border: 1px solid var(--line-strong);
    box-shadow: var(--clay-pressed);
    display: flex; align-items: center; justify-content: center;
    color: var(--teal-600); font-size: 34px;
  }
  .pp-id-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pp-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pp-name { font-size: 26px; font-weight: 800; color: var(--teal-700); line-height: 1.15; overflow-wrap: anywhere; }
  .pp-pid {
    font-size: 11.5px; font-weight: 700; color: var(--teal-700);
    background: var(--surface-card-raised); border: 1px solid var(--line-soft);
    padding: 3px 8px; border-radius: 6px;
  }
  .pp-species { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .pp-health-badge { align-self: flex-start; margin-top: 2px; }
  .pp-health-ok   { background: var(--sage-100); color: var(--sage-600); }
  .pp-health-care { background: var(--amber-100); color: var(--amber-800); }
  .pp-health-off  { background: var(--line-soft); color: var(--ink-soft); }

  .pp-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  /* ---------- Add Record dropdown (header actions only) ---------- */
  .pp-menu { position: relative; display: inline-flex; }
  .pp-menu-toggle .pp-chev { font-size: 10px; margin-left: 2px; transition: transform 0.15s ease; }
  .pp-menu-toggle[aria-expanded="true"] .pp-chev { transform: rotate(180deg); }
  .pp-menu-toggle[aria-expanded="true"] { background: var(--teal-700); border-color: var(--teal-800); }
  .pp-menu-panel {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 40;
    width: 268px; max-width: calc(100vw - 32px);
    background: var(--surface-card-raised);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--clay-raised);
    padding: 8px;
    display: none;
  }
  .pp-menu-panel.open { display: block; }
  .pp-menu-heading {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--ink-faint); padding: 6px 10px 6px;
  }
  .pp-menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 9px 10px; border: none; background: transparent; cursor: pointer;
    border-radius: var(--r-xs); text-align: left; font-family: inherit;
    transition: background 0.12s ease;
  }
  .pp-menu-item:hover, .pp-menu-item:focus-visible { background: var(--teal-50); outline: none; }
  .pp-menu-item:focus-visible { box-shadow: inset 0 0 0 1.5px var(--teal-400); }
  .pp-menu-ico {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: var(--r-xs);
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-sunken); color: var(--teal-600); font-size: 13px;
  }
  .pp-menu-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .pp-menu-title { font-size: 13px; font-weight: 800; color: var(--ink-900); }
  .pp-menu-desc { font-size: 11.8px; font-weight: 500; color: var(--ink-soft); }

  /* ---------- overview cards ---------- */
  .pp-overview {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .pp-subtitle { font-size: 13px; font-weight: 800; color: var(--ink-900); margin-bottom: 12px; }

  .pp-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
  .pp-field { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .pp-field > i { color: var(--ink-faint); font-size: 14px; width: 18px; text-align: center; margin-top: 3px; flex-shrink: 0; }
  .pp-flabel { font-size: 11px; font-weight: 700; color: var(--ink-faint); }
  .pp-fvalue { font-size: 13.2px; font-weight: 600; color: var(--ink-800); overflow-wrap: anywhere; }

  .pp-owner-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .pp-owner-avatar {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: var(--surface-sunken); border: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 20px;
  }
  .pp-owner-name { font-size: 15.5px; font-weight: 800; color: var(--ink-900); overflow-wrap: anywhere; }
  .pp-owner-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }

  .pp-health-list { display: flex; flex-direction: column; }
  .pp-hrow {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1.1fr);
    gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line-soft);
    font-size: 12.8px;
  }
  .pp-hrow:first-child { padding-top: 0; }
  .pp-hrow:last-child { border-bottom: none; padding-bottom: 0; }
  .pp-hrow > i { color: var(--ink-faint); font-size: 13px; text-align: center; }
  .pp-hlabel { font-weight: 600; color: var(--ink-soft); }
  .pp-hvalue { font-weight: 600; color: var(--ink-800); overflow-wrap: anywhere; }

  /* ---------- history tabs ---------- */
  .pp-tabs {
    display: flex; gap: 2px; overflow-x: auto;
    padding-bottom: 1px; /* room for the tabs' -1px margin-bottom, which otherwise overflows the box by 1px and triggers a vertical scrollbar */
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
    scrollbar-width: thin;
  }
  .pp-tab {
    border: none; background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 11px 18px; margin-bottom: -1px;
    font-weight: 700; font-size: 13px; color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .pp-tab i { font-size: 13px; }
  .pp-tab:hover { color: var(--teal-700); }
  .pp-tab.active { color: var(--teal-700); background: var(--surface-card); border-bottom-color: var(--teal-600); }

  .pp-main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }

  /* ---------- tables ---------- */
  .pp-table-wrap { overflow-x: auto; }
  .pp-table { width: 100%; border-collapse: collapse; }
  .pp-table th {
    text-align: left; font-size: 11.2px; font-weight: 800; letter-spacing: 0.03em;
    color: var(--ink-faint); background: var(--surface-sunken);
    padding: 10px 14px; white-space: nowrap;
  }
  .pp-table th:first-child { border-radius: var(--r-xs) 0 0 var(--r-xs); }
  .pp-table th:last-child  { border-radius: 0 var(--r-xs) var(--r-xs) 0; }
  .pp-table td {
    padding: 13px 14px; font-size: 12.8px; font-weight: 500; color: var(--ink-800);
    border-bottom: 1px solid var(--line-soft); vertical-align: middle;
  }
  .pp-table tbody tr:last-child td { border-bottom: none; }
  .pp-empty { text-align: center; padding: 30px 12px; color: var(--ink-faint); font-weight: 600; font-size: 13px; }

  /* ---------- recent activity timeline ---------- */
  .pp-timeline { display: flex; flex-direction: column; }
  .pp-tl-item { position: relative; padding: 0 0 18px 24px; }
  .pp-tl-item:last-child { padding-bottom: 0; }
  .pp-tl-item::before {
    content: ''; position: absolute; left: 4px; top: 14px; bottom: -2px;
    width: 1.5px; background: var(--line);
  }
  .pp-tl-item:last-child::before { display: none; }
  .pp-tl-dot {
    position: absolute; left: 0; top: 5px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--slate-600);
  }
  .pp-tl-date { font-size: 12.5px; font-weight: 800; color: var(--ink-900); }
  .pp-tl-text { font-size: 12.8px; font-weight: 500; color: var(--ink-700); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .pp-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill); }
  .tone-vaccination { background: var(--sage-100); color: var(--sage-600); }
  .tone-consultation { background: var(--teal-100); color: var(--teal-700); }
  .tone-treatment { background: var(--amber-100); color: var(--amber-800); }
  .tone-other { background: var(--slate-100); color: var(--slate-800); }
  .pp-tl-item.tone-vaccination-dot .pp-tl-dot { background: var(--sage-500); }
  .pp-tl-item.tone-consultation-dot .pp-tl-dot { background: var(--teal-500); }
  .pp-tl-item.tone-treatment-dot .pp-tl-dot { background: var(--amber-600); }

  /* ---------- not found ---------- */
  .pp-missing { text-align: center; padding: 56px 20px; }
  .pp-missing h2 { font-size: 17px; margin-bottom: 6px; }
  .pp-missing p { color: var(--ink-soft); font-weight: 500; margin-bottom: 16px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1180px) {
    .pp-overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pp-overview > :first-child { grid-column: 1 / -1; }
    .pp-main { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .pp-overview { grid-template-columns: 1fr; }
    .pp-actions { justify-content: flex-start; }
    .pp-panel { padding: 16px; }
  }
  @media (max-width: 640px) {
    .pp-photo { width: 76px; height: 76px; font-size: 28px; }
    .pp-name { font-size: 22px; }
    .pp-identity { gap: 14px; }
    /* medical table → stacked rows so nothing needs to scroll sideways */
    .pp-table.stackable thead { display: none; }
    .pp-table.stackable, .pp-table.stackable tbody, .pp-table.stackable tr, .pp-table.stackable td { display: block; width: 100%; }
    .pp-table.stackable tr { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .pp-table.stackable tbody tr:last-child { border-bottom: none; }
    .pp-table.stackable td { border: none; padding: 3px 4px; display: flex; gap: 12px; justify-content: space-between; }
    .pp-table.stackable td::before { content: attr(data-label); font-size: 11px; font-weight: 800; color: var(--ink-faint); flex-shrink: 0; }
  }
  @media (max-width: 420px) {
    .pp-fields { grid-template-columns: 1fr; }
    .pp-hrow { grid-template-columns: 22px minmax(0, 1fr); }
    .pp-hrow .pp-hvalue { grid-column: 2; margin-top: -6px; }
    .pp-actions .btn { flex: 1 1 100%; }
    .pp-actions .pp-menu { flex: 1 1 100%; }
    .pp-actions .pp-menu .btn { width: 100%; }
    .pp-tab { padding: 10px 13px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
<aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"><i class="fa-solid fa-paw"></i></div>

          <div class="brand-role">Administrator</div>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
      <div class="nav-group">

        <a href="dashboard.html" class="nav-item" data-page="dashboard.html">

          <span class="nav-label">Dashboard</span>
        </a>
        <a href="appointments.html" class="nav-item" data-page="appointments.html">

          <span class="nav-label">Appointments</span>
        </a>
        <a href="queue.html" class="nav-item" data-page="queue.html">
          <span class="nav-icon"><i class="fa-solid fa-hourglass-half"></i></span>
          <span class="nav-label">Queue</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">PATIENT MANAGEMENT</div>
        <a href="patients.html" class="nav-item active" data-page="patients.html">
          <span class="nav-icon"><i class="fa-solid fa-paw"></i></span>
          <span class="nav-label">Patients</span>
        </a>
        <a href="clients.html" class="nav-item" data-page="clients.html">
          <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
          <span class="nav-label">Clients</span>
        </a>
        <a href="medical-records.html" class="nav-item" data-page="medical-records.html">
          <span class="nav-icon"><i class="fa-solid fa-notes-medical"></i></span>
          <span class="nav-label">Medical Records</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">CLINIC</div>
        <a href="services.html" class="nav-item" data-page="services.html">
          <span class="nav-icon"><i class="fa-solid fa-hospital"></i></span>
          <span class="nav-label">Services</span>
        </a>

        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">INSIGHTS</div>
        <a href="predictive-analytics.html" class="nav-item" data-page="predictive-analytics.html">
          <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span>
          <span class="nav-label">Predictive Analytics</span>
        </a>
        <a href="reports.html" class="nav-item" data-page="reports.html">

        </a>
      </div>
      <div class="nav-group">

          <span class="nav-label">Notifications</span>
        </a>
        <a href="staff-users.html" class="nav-item" data-page="staff-users.html">
          <span class="nav-icon"><i class="fa-solid fa-users"></i></span>

      </div>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-avatar">A</div>
        <div>
          <div class="footer-name">Admin</div>
          <div class="footer-role">Administrator</div>
        </div>
      </div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
        </div>
      </header>

      <main class="page-body" id="pp-root">
        <a class="pp-back" href="patients.html"><i class="fa-solid fa-arrow-left"></i> Patients</a>
        <div class="pp-title">PATIENT PROFILE</div>
        <div id="pp-content"></div>

  <!-- Add Vaccination modal (same fields/behavior as the Patients page modal) -->
  <div class="modal-overlay" id="vaccination-modal-overlay">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">Add Vaccination</div>
        <button class="modal-close" id="vaccination-modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-grid">
        <div class="form-field full">
          <label><i class="fa-solid fa-syringe"></i> Vaccine name</label>
          <input type="text" id="vf-vaccine-name" placeholder="e.g. 4-in-1, Anti-Rabies">
        </div>
        <div class="form-field">
          <label><i class="fa-solid fa-calendar-check"></i> Date given</label>
          <input type="date" id="vf-date-given">
        </div>
        <div class="form-field">
          <label><i class="fa-solid fa-calendar-days"></i> Next due date</label>
          <input type="date" id="vf-next-due">
        </div>
        <div class="form-field full">
          <label>Notes</label>
          <textarea id="vf-notes" placeholder="Optional notes..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="vaccination-modal-cancel">Close</button>
        <button class="btn btn-primary" id="vaccination-modal-save">Save vaccination</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="sidebar.js"></script>
