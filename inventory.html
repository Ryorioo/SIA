<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ---- Inventory module styles (scoped to #inventory-page-body) ----
     Layout/structure is unchanged from before; only the color/theme
     tokens below have been swapped from a standalone hex-based
     palette to the shared Pawsitive Care design tokens already in use
     on Services (see services.html) — teal scale, ink scale, surface
     scale, line/border, radius and clay-shadow tokens, with the
     original hex values kept only as safe fallbacks. */
  #inventory-page-body {
    --inv-teal: var(--teal-700, #0f766e);
    --inv-teal-dark: var(--teal-800, #0b5f58);
    --inv-teal-tint: var(--teal-50, #e7f3f1);
    --inv-teal-focus: var(--teal-400, #0f766e);
    --inv-ink: var(--ink-900, #1f2a2a);
    --inv-ink-soft: var(--ink-soft, #6b7472);
    --inv-ink-faint: var(--ink-faint, #6b7472);
    --inv-border: var(--line-soft, #e4e0d8);
    --inv-border-light: var(--line-soft, #ece9e2);
    --inv-surface-card: var(--surface-card, #fff);
    --inv-surface-sunken: var(--surface-sunken, #faf9f6);
    --inv-radius: var(--r-md, 10px);
    --inv-shadow: var(--clay-flat, 0 1px 2px rgba(31, 42, 42, 0.04));
    --inv-shadow-raised: var(--clay-raised, 0 10px 30px rgba(31, 42, 42, 0.18));
    --inv-danger-bg: var(--red-100, #f5e5e1);
    --inv-danger: var(--red-800, #7a372d);
    --inv-warning-bg: var(--amber-100, #f7ecd6);
    --inv-warning: var(--amber-800, #6d4a09);
  }

  /* --- header cleanup (Inventory page) ---
     Same treatment as Services: the page-level title/breadcrumb that
     used to live in .topbar is removed, so the border-bottom style.css
     draws for pages that keep that title is suppressed here (scoped to
     this page only, style.css untouched). */
  .topbar { border-bottom: none; }

  /* --- header spacing (Inventory page) ---
     Nudges the "Inventory" toolbar block down slightly to fill the space
     left by the removed title/breadcrumb, page-scoped only, matching
     Services' .page-toolbar treatment. */
  .page-toolbar { margin-bottom: 14px; }
  @media (min-width: 981px) { .topbar { display: none; } }

  /* --- filter bar (Inventory page) ---
     Same components as Services: .filter-bar / .search-field /
     .filter-select .pc-select from style.css, with the same page-scoped
     refinements Services applies on top (single-container search field,
     search taking most of the row, fixed-width filter controls, unified
     .pc-select chevron). Page-scoped since style.css is off-limits. */

  /* Search input fills the full width of .search-field; the focused
     look lives on the single outer container so only one border shows. */
  #inv-search {
    flex: 1 1 auto;
    width: 100%;
    box-sizing: border-box;
    background: transparent;
    border: none;
    outline: none;
    box-shadow: none;
    font: inherit;
    color: var(--ink-900);
  }
  .search-field:focus-within {
    border-color: var(--teal-400);
  }

  /* Search gets most of the row; filter controls only take the width
     their contents need — same proportions as Services' filter bar. */
  .filter-bar .search-field {
    flex: 2 1 380px;
    min-width: 260px;
    height: 38px;
  }
  .filter-controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    flex: 0 0 auto;
    /* Without a cap, this container sizes to its three fixed-basis selects
       (170 + 150 + 150 + gaps = 486px) and, at narrow widths, sticks out
       past the filter bar and the viewport instead of wrapping its
       selects. Capping it at the bar's width lets the selects wrap. */
    max-width: 100%;
  }
  .filter-bar #inv-filter-category { flex: 0 0 170px; min-width: 0; }
  .filter-bar #inv-filter-status { flex: 0 0 150px; min-width: 0; }
  .filter-bar #inv-filter-stock { flex: 0 0 150px; min-width: 0; }

  /* Unified select component (identical to Services/Medical Records/
     Patients/Clients): warm beige surface, existing border/radius
     tokens, one CSS-drawn chevron replacing the native arrow. */
  .pc-select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    box-sizing: border-box;
    background-color: var(--surface-sunken);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    color: var(--ink-900);
    font: inherit;
    max-width: 100%;
    padding: 0 34px 0 12px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%),
      linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position:
      calc(100% - 18px) center,
      calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition: border-color 0.15s ease;
  }
  .pc-select::-ms-expand { display: none; }
  .pc-select:hover { border-color: var(--line-strong); }
  .pc-select:focus { outline: none; border-color: var(--teal-400); }

  /* Fixed 38px control height, and keep the chevron drawn while focused
     (style.css's `select:focus` uses the `background` shorthand, which
     would otherwise reset background-image). */
  .filter-bar .pc-select {
    height: 38px;
  }
  .filter-bar .pc-select,
  .filter-bar .pc-select:focus {
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%),
      linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position:
      calc(100% - 18px) center,
      calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  /* Result count — same treatment as Services' .services-count-label. */
  .inv-count {
    font-size: 11.4px;
    font-weight: 700;
    color: var(--ink-faint);
    margin: 0 2px 10px;
  }

  #inventory-page-body .inv-table-wrap {
    background: var(--inv-surface-card);
    border: 1px solid var(--inv-border);
    border-radius: var(--inv-radius);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    box-shadow: var(--inv-shadow);
  }
  #inventory-page-body .inv-table-wrap.is-empty {
    padding: 44px 20px;
    text-align: center;
    color: var(--inv-ink-faint);
    font-size: 13.5px;
  }

  /* Table scrolls horizontally inside .inv-table-wrap rather than being
     clipped or squeezed unreadably; min-width keeps every column
     (Actions included) at a legible width down to the smallest
     breakpoints, matching Services' overflow-x:auto treatment. */
  #inventory-page-body table.inv-table { width: 100%; min-width: 880px; border-collapse: collapse; font-size: 13px; }
  #inventory-page-body .inv-table thead th {
    text-align: left;
    padding: 12px 16px;
    font-size: 10.6px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--inv-ink-faint);
    background: var(--inv-surface-sunken);
    border-bottom: 1px solid var(--inv-border);
    white-space: nowrap;
  }
  #inventory-page-body .inv-table tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--inv-border-light);
    vertical-align: middle;
    color: var(--inv-ink);
    line-height: 1.3;
  }
  #inventory-page-body .inv-table tbody tr:last-child td { border-bottom: none; }
  #inventory-page-body .inv-table tbody tr:hover { background: var(--inv-surface-sunken); }

  #inventory-page-body .inv-item-name { font-weight: 700; color: var(--inv-ink); font-size: 14px; }
  #inventory-page-body .inv-secondary { color: var(--inv-ink-soft); font-weight: 600; }

  /* Quantity + stock badge sit on one stable row (not stacked), so a
     Low/Out pill can never push the row taller — the row height is
     governed only by the cell's line-height, matching Services'
     uniform row rhythm. Quantity keeps its own larger/bolder styling
     so it stays the visually dominant value in the row. */
  #inventory-page-body .inv-qty-stack { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; white-space: nowrap; }
  #inventory-page-body .inv-qty { font-size: 15px; font-weight: 800; color: var(--inv-ink); font-variant-numeric: tabular-nums; }
  #inventory-page-body .inv-pill {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    line-height: 1.4;
  }
  #inventory-page-body .inv-pill.low { background: var(--inv-warning-bg); color: var(--inv-warning); }
  #inventory-page-body .inv-pill.out { background: var(--inv-danger-bg); color: var(--inv-danger); }
  #inventory-page-body .inv-pill.expired { background: var(--inv-danger-bg); color: var(--inv-danger); }

  #inventory-page-body .inv-price-cell { font-variant-numeric: tabular-nums; }

  #inventory-page-body .inv-exp-stack { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; white-space: nowrap; }
  #inventory-page-body .inv-exp-date { color: var(--inv-ink-soft); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Empty-state row: keeps the same table/thead shell instead of
     swapping in an unrelated block, so filtering to zero results
     doesn't cause a large layout jump. */
  #inventory-page-body .inv-empty-row td {
    padding: 44px 20px;
    text-align: center;
    color: var(--inv-ink-faint);
    font-size: 13.5px;
    font-weight: 600;
  }

  #inventory-page-body .inv-status-badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }
  #inventory-page-body .inv-status-badge.active { background: var(--inv-teal-tint); color: var(--inv-teal); }
  #inventory-page-body .inv-status-badge.inactive { background: var(--inv-surface-sunken); color: var(--inv-ink-faint); }

  /* Actions column (table rows only) — Edit is now the same compact
     icon-only .icon-btn treatment used by Services (30x30, existing
     border/radius tokens, muted icon at rest, teal border/icon on
     hover), and Adjust Stock is now the shared .btn/.btn-sm secondary
     button from style.css, matching Services' compact labeled row
     action. Page-scoped since style.css is off-limits; .btn/.btn-sm
     themselves already live in style.css, untouched. */
  #inventory-page-body .inv-actions { display: flex; gap: 8px; align-items: center; white-space: nowrap; }

  #inventory-page-body .icon-btn {
    width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm); border: 1px solid var(--line-soft); background: var(--surface-card-raised);
    color: var(--ink-soft); cursor: pointer; box-shadow: var(--clay-flat); font-size: 12px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  #inventory-page-body .icon-btn:hover { border-color: var(--teal-400); color: var(--teal-700); }

  /* .inv-btn-ghost remains unchanged below — it's still used by the
     Add/Edit and Adjust Stock modals (Phase 2E scope), just no longer
     by the table row actions above. (.inv-btn-outline was only ever
     used by the old Adjust Stock row button and is removed as dead
     code; it was not referenced by any modal.) */
  #inventory-page-body .inv-btn-ghost {
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s ease;
    background: var(--inv-surface-card);
    border: 1px solid var(--inv-border);
    color: var(--inv-ink);
  }
  #inventory-page-body .inv-btn-ghost:hover { background: var(--inv-surface-sunken); }

  /* Modals launched from Inventory (Add/Edit item, Adjust stock) —
     retinted onto the same shared tokens as the page above, so the
     modal no longer carries its own hardcoded hex palette. */
  #inv-modal-overlay .inv-modal-box {
    background: var(--surface-card, #fff);
    border-radius: var(--r-md, 10px);
    box-shadow: var(--clay-raised, 0 10px 30px rgba(31, 42, 42, 0.18));
  }
  #inv-modal-overlay h3 {
    margin: 0 0 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-900, #1f2a2a);
  }
  #inv-modal-overlay label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-900, #1f2a2a);
    margin-bottom: 4px;
  }
  #inv-modal-overlay input,
  #inv-modal-overlay select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--line-soft, #e4e0d8);
    border-radius: 7px;
    font-size: 13.5px;
    color: var(--ink-900, #1f2a2a);
    background: var(--surface-card, #fff);
  }
  #inv-modal-overlay input:focus,
  #inv-modal-overlay select:focus {
    outline: none;
    border-color: var(--teal-400, #0f766e);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
  }
  #inv-modal-overlay .inv-field { margin-bottom: 12px; }
  #inv-modal-overlay .inv-btn-primary {
    background: var(--teal-700, #0f766e);
    border: 1px solid var(--teal-700, #0f766e);
    color: #fff;
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  #inv-modal-overlay .inv-btn-primary:hover { background: var(--teal-800, #0b5f58); }
  #inv-modal-overlay .inv-btn-ghost {
    background: var(--surface-card, #fff);
    border: 1px solid var(--line-soft, #e4e0d8);
    color: var(--ink-900, #1f2a2a);
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  #inv-modal-overlay .inv-btn-ghost:hover { background: var(--surface-sunken, #faf9f6); }
  #inv-modal-overlay .inv-error {
    color: var(--status-cancelled-fg, #b3261e);
    font-size: 12.5px;
    margin: 8px 0;
    display: none;
  }

  /* --- Add/Edit Inventory Item modal (Phase 2E-1) ---
     Same shell as the Add/Edit Service and Medical Records modals: fixed
     header (title + x), scrolling body (.form-grid), fixed footer, capped
     at min(88vh, 100dvh - 40px) so only the body scrolls. Scoped to
     .inv-item-modal so the Adjust Stock modal (which shares
     #inv-modal-overlay / .inv-modal-box) is not affected. */
  #inv-modal-overlay .inv-item-modal {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    width: min(610px, calc(100vw - 40px));
    max-width: 100%;
    padding: 0;
    overflow: hidden;
    max-height: 88vh;
    max-height: min(88vh, calc(100dvh - 40px));
    background: var(--surface-card-raised, #fff);
    border-radius: var(--r-lg, 18px);
    box-shadow: var(--clay-pop, 0 24px 48px -20px rgba(16, 68, 58, 0.32));
  }
  #inv-modal-overlay .inv-item-modal .modal-head {
    flex: none;
    margin: 0;
    padding: 22px 26px 16px;
    border-bottom: 1px solid var(--line-soft, #e4e0d8);
  }
  #inv-modal-overlay .inv-item-modal .modal-title {
    margin: 0;
    font-size: 16.5px;
    font-weight: 800;
    color: var(--ink-900, #1f2a2a);
  }
  #inv-modal-overlay .inv-item-modal #inv-item-form {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }
  #inv-modal-overlay .inv-item-modal .form-grid {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    padding: 18px 26px;
  }
  #inv-modal-overlay .inv-item-modal .inv-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    margin: 0;
  }
  #inv-modal-overlay .inv-item-modal .inv-field.full { grid-column: 1 / -1; }
  #inv-modal-overlay .inv-item-modal .inv-field label {
    margin: 0;
    font-size: 12.2px;
    font-weight: 700;
    color: var(--ink-soft, #6b7472);
  }
  #inv-modal-overlay .inv-item-modal .inv-help {
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--ink-faint, #6b7472);
  }

  /* Controls: 38px, sunken warm fill, pressed clay inset, teal focus ring
     (same look the shared text/date/select controls get in style.css;
     number inputs aren't covered there, so all controls are styled here). */
  #inv-modal-overlay .inv-item-modal input,
  #inv-modal-overlay .inv-item-modal select {
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--line-soft, #e4e0d8);
    border-radius: var(--r-sm, 10px);
    background-color: var(--surface-sunken, #eee8db);
    box-shadow: var(--clay-pressed, inset 0 1px 3px rgba(31, 42, 46, 0.10));
    color: var(--ink-800, #1f2a2a);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  }
  #inv-modal-overlay .inv-item-modal input:focus,
  #inv-modal-overlay .inv-item-modal select:focus {
    outline: none;
    border-color: var(--teal-400, #0f766e);
    background-color: var(--surface-card-raised, #fff);
    box-shadow: 0 0 0 3px var(--teal-100, rgba(15, 118, 110, 0.12));
  }
  #inv-modal-overlay .inv-item-modal select {
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-faint, #6b7472) 50%),
      linear-gradient(135deg, var(--ink-faint, #6b7472) 50%, transparent 50%);
    background-repeat: no-repeat;
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    padding-right: 30px;
  }
  #inv-modal-overlay .inv-item-modal select::-ms-expand { display: none; }

  /* Error line sits between body and footer so it stays visible. */
  #inv-modal-overlay .inv-item-modal .inv-error { flex: none; margin: 0; padding: 0 26px 10px; }

  #inv-modal-overlay .inv-item-modal .modal-footer {
    flex: none;
    margin: 0;
    padding: 16px 26px 20px;
    border-top: 1px solid var(--line-soft, #e4e0d8);
  }
  #inv-modal-overlay .inv-item-modal .inv-btn-ghost,
  #inv-modal-overlay .inv-item-modal .inv-btn-primary {
    padding: 9px 15px;
    border-radius: var(--r-sm, 10px);
    font-family: inherit;
    font-size: 13.2px;
    font-weight: 700;
    box-shadow: var(--clay-flat, 0 1px 2px rgba(31, 42, 46, 0.045));
  }
  #inv-modal-overlay .inv-item-modal .inv-btn-ghost:hover {
    border-color: var(--teal-400, #0f766e);
    color: var(--teal-700, #0f766e);
    background: var(--surface-card-raised, #fff);
  }
  #inv-modal-overlay .inv-item-modal .inv-btn-primary {
    background: var(--teal-600, #0f766e);
    border-color: var(--teal-700, #0f766e);
    color: var(--ink-on-brand, #fff);
    box-shadow: 0 1px 1px rgba(5, 34, 29, 0.3), 0 8px 16px -8px rgba(16, 68, 58, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  #inv-modal-overlay .inv-item-modal .inv-btn-primary:hover {
    background: var(--teal-500, #0b5f58);
    border-color: var(--teal-600, #0f766e);
  }
  /* Visible keyboard focus for the modal's buttons (inputs/selects already
     get the teal focus ring above). */
  #inv-modal-overlay .inv-item-modal .modal-close:focus-visible,
  #inv-modal-overlay .inv-item-modal .inv-btn-ghost:focus-visible,
  #inv-modal-overlay .inv-item-modal .inv-btn-primary:focus-visible {
    outline: 2px solid var(--teal-400, #0f766e);
    outline-offset: 2px;
  }
  @media (max-width: 620px) {
    #inv-modal-overlay .inv-item-modal .modal-head,
    #inv-modal-overlay .inv-item-modal .form-grid,
    #inv-modal-overlay .inv-item-modal .modal-footer { padding-left: 18px; padding-right: 18px; }
    #inv-modal-overlay .inv-item-modal .inv-error { padding-left: 18px; padding-right: 18px; }
  }

  /* --- Inventory Overview (page-scoped) ---
     Follows the Predictive Analytics layout language: page header with
     title + actions, sunken summary cards (one teal lead card), then
     bordered modules whose tables sit on an inner page-bg surface.
     Reuses .inv-table / .inv-pill / .inv-item-name / .inv-qty and the
     shared .btn / .btn-sm / .btn-primary. New classes are prefixed .ov- */
  #inventory-page-body #inv-overview { min-width: 0; }

  /* Header */
  #inventory-page-body .ov-header { align-items: center; margin-bottom: 40px; }
  #inventory-page-body .ov-header-text { min-width: 0; flex: 1 1 auto; }
  #inventory-page-body .ov-title { margin: 0 0 2px; font-size: 20px; font-weight: 800; line-height: inherit; letter-spacing: normal; color: var(--ink-900); }
  #inventory-page-body .ov-header-actions { display: flex; flex-wrap: wrap; gap: 8px; flex: 0 0 auto; }
  #inventory-page-body .ov-header-actions .btn { text-decoration: none; white-space: nowrap; }

  /* Summary cards */
  #inventory-page-body .ov-cards { list-style: none; margin: 0 0 24px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  #inventory-page-body .ov-card { box-sizing: border-box; min-width: 0; height: 100%; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  #inventory-page-body .ov-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #inventory-page-body .ov-label { font-size: 12px; font-weight: 700; color: var(--ink-700); line-height: 1.3; }
  #inventory-page-body .ov-icon { flex: none; font-size: 12px; color: var(--ink-soft); }
  #inventory-page-body .ov-num { font-size: 26px; font-weight: 800; line-height: 1.15; color: var(--ink-900); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #inventory-page-body .ov-note { font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--ink-700); overflow-wrap: anywhere; }
  #inventory-page-body .ov-card-primary { background: var(--teal-700); border-color: var(--teal-700); }
  #inventory-page-body .ov-card-primary .ov-icon { color: rgba(244, 249, 247, 0.85); }
  #inventory-page-body .ov-card-primary .ov-label,
  #inventory-page-body .ov-card-primary .ov-note { color: rgba(244, 249, 247, 0.86); }
  #inventory-page-body .ov-card-primary .ov-num { color: var(--ink-on-brand); }

  /* Modules */
  #inventory-page-body .ov-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; align-items: start; }
  #inventory-page-body .ov-panel { box-sizing: border-box; min-width: 0; padding: 16px 18px 18px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  #inventory-page-body .ov-act { margin-bottom: 24px; }
  #inventory-page-body .ov-panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; margin-bottom: 14px; }
  #inventory-page-body .ov-panel-headtext { min-width: 0; flex: 1 1 200px; }
  #inventory-page-body .ov-panel-title { margin: 0; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; color: var(--ink-800); }
  #inventory-page-body .ov-view-link { text-decoration: none; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-pill); color: var(--ink-800); font-size: 12px; font-weight: 700; white-space: nowrap; transition: border-color 0.15s ease, color 0.15s ease; }
  #inventory-page-body .ov-view-link:hover { border-color: var(--teal-400); color: var(--teal-700); }
  #inventory-page-body .ov-view-link:focus-visible { outline: none; border-color: var(--teal-400); box-shadow: 0 0 0 3px var(--teal-100); }
  #inventory-page-body .ov-view-link i { font-size: 10px; }

  /* Inner table surface (same as Predictive's module tables) */
  #inventory-page-body .ov-scroll { padding: 6px 10px 4px; background: var(--surface-bg); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: inset 0 1px 2px rgba(31, 42, 46, 0.05); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #inventory-page-body table.inv-table.ov-table { min-width: 0; }
  #inventory-page-body .ov-table thead th { padding: 10px 12px; color: var(--ink-700); background: var(--surface-sunken); border-bottom-color: transparent; }
  #inventory-page-body .ov-table thead th:first-child { border-top-left-radius: var(--r-xs); border-bottom-left-radius: var(--r-xs); }
  #inventory-page-body .ov-table thead th:last-child { border-top-right-radius: var(--r-xs); border-bottom-right-radius: var(--r-xs); }
  #inventory-page-body .ov-table tbody td { padding: 11px 12px; border-bottom-color: var(--line); overflow-wrap: anywhere; }
  #inventory-page-body .ov-table tbody tr:last-child td { border-bottom: none; }
  #inventory-page-body .ov-table tbody tr:hover { background: transparent; }
  #inventory-page-body .ov-table .inv-item-name { font-size: 13.5px; }
  #inventory-page-body .ov-table .inv-secondary { color: var(--ink-700); }
  #inventory-page-body .ov-table .inv-empty-row td { color: var(--ink-700); }
  #inventory-page-body .ov-sub-line { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  #inventory-page-body .ov-more { padding: 10px 2px 0; font-size: 12px; font-weight: 600; color: var(--ink-700); }
  #inventory-page-body .ov-table .btn-sm { text-decoration: none; white-space: nowrap; }
  #inventory-page-body .ov-panel .btn:focus-visible { outline: 2px solid var(--inv-teal-focus); outline-offset: 2px; }

  #inventory-page-body .inv-pill.added   { background: var(--teal-100); color: var(--teal-700); }
  #inventory-page-body .inv-pill.updated { background: var(--surface-sunken); color: var(--ink-700); border: 1px solid var(--line-soft); }

  @media (max-width: 1239px) { #inventory-page-body .ov-panels { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 1100px) { #inventory-page-body .ov-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 900px) {
    #inventory-page-body .ov-header { flex-direction: column; align-items: stretch; gap: 14px; }
  }

  /* Phones: tables reflow into labelled rows instead of scrolling sideways. */
  @media (max-width: 640px) {
    #inventory-page-body .ov-cards { grid-template-columns: minmax(0, 1fr); }
    #inventory-page-body .ov-header-actions .btn { flex: 1 1 auto; min-height: 44px; }
    #inventory-page-body .ov-panel { padding: 14px 14px 16px; }
    #inventory-page-body .ov-scroll { padding: 4px 10px; }
    #inventory-page-body .ov-table thead { display: none; }
    #inventory-page-body .ov-table, #inventory-page-body .ov-table tbody,
    #inventory-page-body .ov-table tr, #inventory-page-body .ov-table td { display: block; width: 100%; box-sizing: border-box; }
    #inventory-page-body .ov-table tbody tr { padding: 8px 0; border-bottom: 1px solid var(--line); }
    #inventory-page-body .ov-table tbody tr:last-child { border-bottom: none; }
    #inventory-page-body .ov-table tbody td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 2px; border-bottom: none; text-align: right; }
    #inventory-page-body .ov-table tbody td::before { content: attr(data-label); flex: none; font-size: 11px; font-weight: 700; color: var(--ink-700); text-align: left; }
    #inventory-page-body .ov-table .inv-empty-row td { display: block; text-align: center; }
    #inventory-page-body .ov-table .inv-empty-row td::before { content: none; }
  }
</style>
