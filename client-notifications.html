<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     CLIENT NOTIFICATIONS — page-scoped styles only (style.css
     untouched). Reuses existing design tokens from style.css, the
     same approach client-dashboard.html already takes for its own
     page-specific card/row layouts.
     ============================================================ */

  .notif-page .stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .notif-page .stat-card {
    flex: 1; min-width: 150px;
    background: var(--surface-card); border: 1px solid var(--line-soft);
    border-radius: var(--r-lg); box-shadow: var(--clay-flat);
    padding: 16px 18px;
  }
  .notif-page .stat-card-label { font-size: 11.2px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; font-weight: 700; margin-bottom: 6px; }
  .notif-page .stat-card-value { font-size: 24px; font-weight: 800; color: var(--ink-900); }

  .notif-page .notif-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .notif-page .notif-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .notif-page .notif-filter-tab {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-soft);
    background: var(--surface-card); color: var(--ink-800); font-size: 12.6px; font-weight: 700; cursor: pointer;
  }
  .notif-page .notif-filter-tab.is-active { background: var(--teal-600); color: #fff; border-color: var(--teal-600); }
  .notif-page .mark-all-btn {
    padding: 7px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-soft);
    background: var(--surface-card); color: var(--ink-800); font-size: 12.6px; font-weight: 700; cursor: pointer;
  }
  .notif-page .mark-all-btn:hover { border-color: var(--teal-400); color: var(--teal-700); }

  .notif-page .notif-list { display: flex; flex-direction: column; gap: 10px; }
  .notif-page .notif-item {
    display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start;
    background: var(--surface-card); border: 1px solid var(--line-soft);
    border-radius: var(--r-md); box-shadow: var(--clay-flat);
  }
  .notif-page .notif-item.is-unread { background: var(--surface-card-raised); border-left: 3px solid var(--teal-600); }
  .notif-page .notif-item-icon { font-size: 16px; color: var(--ink-faint); margin-top: 2px; }
  .notif-page .notif-item.priority-high .notif-item-icon { color: #dc2626; }
  .notif-page .notif-item.priority-medium .notif-item-icon { color: #d97706; }
  .notif-page .notif-item-body { flex: 1; min-width: 0; }
  .notif-page .notif-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
  .notif-page .notif-item-title { font-weight: 800; font-size: 13.5px; color: var(--ink-900); }
  .notif-page .notif-badge { font-size: 10.8px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: capitalize; }
  .notif-page .notif-badge-high { background: #fee2e2; color: #b91c1c; }
  .notif-page .notif-badge-medium { background: #fef3c7; color: #b45309; }
  .notif-page .notif-badge-low { background: var(--line-soft); color: var(--ink-800); }
  .notif-page .notif-item-message { font-size: 12.8px; color: var(--ink-soft); font-weight: 600; }
  .notif-page .notif-item-time { font-size: 11px; color: var(--ink-faint); margin-top: 4px; font-weight: 600; }
  .notif-page .notif-item-mark {
    border: none; background: var(--surface-card-raised); color: var(--ink-800);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
  }
  .notif-page .notif-item-mark:hover { background: var(--teal-50); color: var(--teal-700); }

  .notif-page .notif-empty {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 56px 20px; color: var(--ink-faint); text-align: center;
    background: var(--surface-card); border: 1px solid var(--line-soft); border-radius: var(--r-lg);
  }
  .notif-page .notif-empty i { font-size: 30px; margin-bottom: 10px; color: var(--teal-400); }
  .notif-page .notif-empty div { font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"><i class="fa-solid fa-paw"></i></div>
        <div class="brand-text">
          <div class="brand-name">Pawsitive Care</div>
          <div class="brand-role">Pet Owner</div>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">MAIN</div>
          <a href="client-dashboard.html" class="nav-item" data-page="client-dashboard.html">
            <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
            <span class="nav-label">Dashboard</span>
          </a>
          <a href="client-appointments.html" class="nav-item" data-page="client-appointments.html">
            <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
            <span class="nav-label">Appointments</span>
          </a>
          <a href="client-queue.html" class="nav-item" data-page="client-queue.html">
            <span class="nav-icon"><i class="fa-solid fa-hourglass-half"></i></span>
            <span class="nav-label">Queue</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">MY PETS</div>
          <a href="client-pets.html" class="nav-item" data-page="client-pets.html">
            <span class="nav-icon"><i class="fa-solid fa-paw"></i></span>
            <span class="nav-label">My Pets</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">MEDICAL</div>
          <a href="client-medical-records.html" class="nav-item" data-page="client-medical-records.html">
            <span class="nav-icon"><i class="fa-solid fa-notes-medical"></i></span>
            <span class="nav-label">Medical Records</span>
          </a>
          <a href="client-vaccinations.html" class="nav-item" data-page="client-vaccinations.html">
            <span class="nav-icon"><i class="fa-solid fa-syringe"></i></span>
            <span class="nav-label">Vaccinations</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">ACCOUNT</div>
          <a href="client-notifications.html" class="nav-item active" data-page="client-notifications.html">
            <span class="nav-icon"><i class="fa-solid fa-bell"></i></span>
            <span class="nav-label">Notifications</span>
          </a>
          <a href="client-billing.html" class="nav-item" data-page="client-billing.html">
            <span class="nav-icon"><i class="fa-solid fa-credit-card"></i></span>
            <span class="nav-label">Billing</span>
          </a>
          <a href="profile.html" class="nav-item" data-page="profile.html">
            <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
            <span class="nav-label">Profile</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-avatar" id="footer-avatar">?</div>
        <div>
          <div class="footer-name" id="footer-name">—</div>
          <div class="footer-role">Pet Owner</div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
          <div>
            <div class="topbar-title">Notifications</div>
            <div class="topbar-crumb">Pawsitive Care / Notifications</div>
          </div>
        </div>
      </header>

      <main class="page-body notif-page">
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-card-label">Total</div>
            <div class="stat-card-value" id="statTotal">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">Unread</div>
            <div class="stat-card-value" id="statUnread">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">High Priority</div>
            <div class="stat-card-value" id="statHigh">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">Recent (24h)</div>
            <div class="stat-card-value" id="statRecent">0</div>
          </div>
        </div>

        <div class="notif-toolbar">
          <div class="notif-filters">
            <button class="notif-filter-tab is-active" data-filter="all">All</button>
            <button class="notif-filter-tab" data-filter="unread">Unread</button>
            <button class="notif-filter-tab" data-filter="appointment">Appointments</button>
            <button class="notif-filter-tab" data-filter="vaccination">Vaccinations</button>
          </div>
          <button class="mark-all-btn" id="markAllReadBtn"><i class="fa-solid fa-check-double"></i>&nbsp; Mark all as read</button>
        </div>

        <div class="notif-list" id="notifList"></div>

        <div class="notif-empty" id="notifEmpty">
          <i class="fa-regular fa-bell-slash"></i>
          <div id="notifEmptyText">No notifications yet.</div>
        </div>
      </main>
    </div>
  </div>

  <!-- data-store.js first (owns PCData), then patient-data-store.js
       (required for the vaccination-record lookups used to scope
       vaccination notifications to this client's own pets), then
       notifications-data-store.js (owns the shared notification
       store + this page's client-scoped read functions), then the
       client session helper, then this page's own DOM wiring. -->
  <script src="data-store.js"></script>
  <script src="patient-data-store.js"></script>
  <script src="notifications-data-store.js"></script>
  <script src="client-session.js"></script>
  <script src="client-notifications.js"></script>
</body>
</html>
