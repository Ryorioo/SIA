<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Demand · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Medicine Demand — page-scoped styles (md- prefix). Same structure as the
     cleaned Disease Risk page: title-only header, one outer analysis surface,
     inner content surfaces only for tables and confidence tiles. Every color,
     border, shadow and radius uses existing style.css tokens. */

  /* Header: title only. The shared topbar only holds the hamburger, hidden
     above 980px, so collapse it on desktop (same as Disease Risk / Overview). */
  .topbar { border-bottom: none; }
  @media (min-width: 981px) { .topbar { display: none; } }
  .md-page-title { margin: 0 0 2px; font-size: 20px; font-weight: 800; line-height: inherit; letter-spacing: normal; color: var(--ink-900); }
  .md-page-header { margin-bottom: 30px; }

  /* Each major section is its own independent surface (same treatment as the
     Overview's modules); there is no wrapper around the page. */
  .md-section-surface { box-sizing: border-box; min-width: 0; padding: 16px 18px 18px; margin-bottom: 24px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  .md-section-heading { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }

  /* Wide-screen layout only (>= 1100px): #md-root becomes a two-column grid.
     Every direct child (page header, Analysis, Confidence, Forecast Note,
     and the .md-empty fallback) spans both columns, so only Demand Trends
     (#md-trends-heading) and Inventory Pressure (#md-pressure-heading) drop
     into one column each. They stay separate <section> surfaces; row-gap is 0
     so each section keeps its own margin-bottom. Below 1100px there is no
     grid at all, so everything stacks exactly as before. */
  @media (min-width: 1100px) {
    #md-root { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; row-gap: 0; }
    #md-root > * { grid-column: 1 / -1; min-width: 0; }
    #md-root > .md-section:has(> #md-trends-heading),
    #md-root > .md-section:has(> #md-pressure-heading) { grid-column: auto; }

    /* Half-width tables (Trends + Pressure only): fit every column inside the
       half-width surface with no sideways scrolling. The 440px min-width is
       dropped, cells may wrap, per-cell min-widths are released, and padding is
       tightened slightly. Font sizes and colors are untouched. */
    #md-root .md-mini-table-wrap { overscroll-behavior-x: contain; }
    #md-root .md-mini-table { width: 100%; min-width: 0; table-layout: auto; }
    #md-root .md-mini-table th, #md-root .md-mini-table td { padding: 8px 6px; white-space: normal; overflow-wrap: break-word; word-break: normal; }
    #md-root .md-mini-table thead th { letter-spacing: 0.02em; }
    #md-root .md-mini-table th:first-child, #md-root .md-mini-table td:first-child { padding-left: 10px; }
    #md-root .md-mini-table th:last-child, #md-root .md-mini-table td:last-child { padding-right: 10px; }
    #md-root .md-mini-table .md-name-cell,
    #md-root .md-mini-table .md-stock-stack,
    #md-root .md-mini-table .md-support,
    #md-root .md-mini-table .md-rec-cell { min-width: 0; }
    #md-root .md-mini-table .md-trend { white-space: normal; gap: 4px; }
  }

  .pa-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .pa-badge-nodata { background: transparent; color: var(--ink-700); border: 1px solid var(--line-strong); }
  .md-empty { padding: 16px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); color: var(--ink-700); font-size: 13px; font-weight: 500; }

  /* Tables — inner content surface (page-bg tone, hairline border, faint inset),
     same as the Overview's Medicine & Inventory Pressure table. */
  .md-table-wrap, .md-mini-table-wrap { position: relative; /* contains the sr-only captions inside the scroller */ background: var(--surface-bg); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: inset 0 1px 2px rgba(31, 42, 46, 0.05); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .md-table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 13px; }
  .md-mini-table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: 12.5px; }
  .md-table thead th, .md-mini-table thead th { text-align: left; padding: 10px 12px; font-size: 10.6px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-700); background: var(--surface-sunken); border-bottom: 1px solid transparent; white-space: nowrap; }
  .md-table thead th:first-child, .md-mini-table thead th:first-child { border-top-left-radius: var(--r-xs); border-bottom-left-radius: var(--r-xs); }
  .md-table thead th:last-child, .md-mini-table thead th:last-child { border-top-right-radius: var(--r-xs); border-bottom-right-radius: var(--r-xs); }
  .md-table tbody th, .md-table tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; color: var(--ink-900); line-height: 1.35; }
  .md-mini-table tbody th, .md-mini-table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; color: var(--ink-900); }
  .md-table tbody tr:last-child th, .md-table tbody tr:last-child td,
  .md-mini-table tbody tr:last-child th, .md-mini-table tbody tr:last-child td { border-bottom: none; }
  .md-table tbody tr:hover, .md-mini-table tbody tr:hover { background: var(--surface-sunken); }
  .md-name-cell { min-width: 150px; }
  .md-name { display: block; font-size: 14px; font-weight: 700; color: var(--ink-900); }
  .md-mini-name { font-weight: 700; color: var(--ink-900); }
  .md-stock-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 110px; }
  .md-qty { font-size: 12.5px; font-weight: 600; color: var(--ink-700); }
  .md-demand-level { font-size: 13px; font-weight: 700; color: var(--ink-900); }
  .md-support { margin-top: 2px; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--ink-700); min-width: 140px; }
  .md-trend { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-700); white-space: nowrap; }
  .md-trend i { font-size: 12px; color: var(--ink-soft); }
  .md-trend-none { color: var(--ink-faint); }
  .md-rec-cell { min-width: 190px; font-size: 12.5px; font-weight: 500; color: var(--ink-800); }

  /* Demand Confidence tiles — same tile treatment as Disease Risk's Data Confidence */
  .md-conf-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .md-conf-card { box-sizing: border-box; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-xs); }
  .md-conf-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .md-conf-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .md-conf-dot.high { background: var(--teal-700); }
  .md-conf-dot.medium { background: var(--amber-600); }
  .md-conf-dot.low { background: var(--red-600); }
  .md-conf-dot.none { background: transparent; border: 1.5px solid var(--ink-soft); }
  .md-conf-label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-800); overflow-wrap: anywhere; }
  .md-conf-value { margin-top: 8px; font-size: 22px; font-weight: 800; color: var(--ink-900); line-height: 1.1; }
  .md-conf-sub { font-size: 11px; font-weight: 500; color: var(--ink-700); }
  @media (max-width: 900px) { .md-conf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Forecast note */
  .md-note { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); }
  .md-note i { flex: none; margin-top: 2px; color: var(--teal-700); font-size: 14px; }
  .md-note-title { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--ink-800); }
  .md-note-text { margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.55; color: var(--ink-700); }

  .pa-pill { display: inline-flex; align-items: center; width: fit-content; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.4; }

  @media (max-width: 480px) { .md-section-surface { padding: 14px 12px 16px; } }
</style>
</head>
