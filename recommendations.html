<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommendations · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     Recommendations (Phase 2D) — page-scoped styles.
     Reuses style.css tokens/classes throughout (status-badge colors,
     --surface-sunken/--surface-card/--line-soft/--r-md/--clay-flat,
     .btn) and the same "pa-" structural conventions already
     established by predictive-analytics.html's page-scoped styles
     (Analysis Controls panel, overview-card grid, snapshot tables).
     If/when these are promoted, they should move into style.css
     alongside the rest of the Predictive Analytics page styles.
     ============================================================ */

  .pa-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .pa-empty { color: #6b7280; font-size: 0.9rem; padding: 8px 0; }

  /* --- Back link --- */

  /* --- Page header --- */
  .pa-page-title { margin: 0 0 6px; font-size: 26px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink-900); }

  /* --- Analysis Controls (same pattern as predictive-analytics.html) ---
     The period selector is intentionally disabled here: the underlying
     PCData.Predictive engine only supports its own fixed recent/baseline
     windows, so a selector that looked functional but silently did
     nothing would be misleading. It stays visible (all periods listed)
     to show the intended control surface, with a short note explaining
     why it's inactive for now. */
  .pa-controls-note { margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); max-width: 260px; line-height: 1.4; }

  /* --- Recommendation Summary (same visual language as Analysis
     Overview's cards: warm sunken surface, line-soft border, --r-md
     radius, --clay-flat shadow, lead card in deep teal). --- */
  .pa-recsum { margin-bottom: 24px; }
  .pa-recsum-heading { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }
  .pa-recsum-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .pa-recsum-card { box-sizing: border-box; min-width: 0; height: 100%; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  .pa-recsum-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pa-recsum-icon-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pa-recsum-icon { flex: none; width: 28px; height: 28px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; background: var(--surface-card); color: var(--teal-700); font-size: 12.5px; }
  .pa-recsum-label { font-size: 12px; font-weight: 700; color: var(--ink-700); line-height: 1.3; overflow-wrap: anywhere; }
  .pa-recsum-link { flex: none; font-size: 11px; color: var(--ink-soft); }
  .pa-recsum-value { font-size: 26px; font-weight: 800; color: var(--ink-900); line-height: 1.15; overflow-wrap: anywhere; }
  .pa-recsum-desc { font-size: 12px; font-weight: 500; color: var(--ink-700); line-height: 1.4; }
  .pa-recsum-card-primary { background: var(--teal-700); border-color: var(--teal-700); }
  .pa-recsum-card-primary .pa-recsum-icon { background: rgba(244, 249, 247, 0.14); color: var(--ink-on-brand); }
  .pa-recsum-card-primary .pa-recsum-label,
  .pa-recsum-card-primary .pa-recsum-desc { color: rgba(244, 249, 247, 0.86); }
  .pa-recsum-card-primary .pa-recsum-value { color: var(--ink-on-brand); }
  .pa-recsum-card-primary .pa-recsum-link { color: rgba(244, 249, 247, 0.7); }
  @media (max-width: 1100px) { .pa-recsum-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .pa-recsum-grid { grid-template-columns: minmax(0, 1fr); } }

  /* --- Current Recommendations — full-width structured list. One row
     per active recommendation type (Stock/Monitoring/Data Collection),
     each summarizing the items behind it; never one row per raw item. --- */
  .pa-cr { margin-bottom: 24px; }
  .pa-cr-heading { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }
  .pa-cr-table-wrap { background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .pa-cr-table { width: 100%; min-width: 660px; border-collapse: collapse; font-size: 13px; }
  .pa-cr-table thead th { text-align: left; padding: 12px 16px; font-size: 10.6px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-700); background: var(--surface-sunken); border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .pa-cr-table tbody td { padding: 16px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .pa-cr-table tbody tr:last-child td { border-bottom: none; }
  .pa-cr-action { display: flex; align-items: flex-start; gap: 12px; min-width: 220px; }
  .pa-cr-icon { flex: none; width: 34px; height: 34px; margin-top: 1px; border-radius: var(--r-sm); background: var(--teal-50); color: var(--teal-700); display: flex; align-items: center; justify-content: center; font-size: 13.5px; }
  .pa-cr-title { font-size: 14px; font-weight: 800; color: var(--ink-900); line-height: 1.35; }
  .pa-cr-action-desc { margin-top: 3px; font-size: 12px; font-weight: 500; color: var(--ink-700); line-height: 1.4; }
  .pa-cr-context { min-width: 240px; font-size: 12.5px; font-weight: 500; color: var(--ink-800); line-height: 1.55; }
  .pa-cr-priority-cell { white-space: nowrap; }
  .pa-cr-end-cell { text-align: right; }
  .pa-cr-arrow { color: var(--ink-faint); font-size: 12px; }
  .pa-cr-empty { padding: 16px 18px; }

  /* --- Stock Actions / Monitoring Actions / Data Collection panels --- */
  .pa-lower2-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 24px; }
  .pa-lower2-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 1000px) { .pa-lower2-grid { grid-template-columns: minmax(0, 1fr); } }

  .pa-panel { box-sizing: border-box; min-width: 0; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); padding: 18px; }
  .pa-panel-heading { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }
  .pa-panel-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line-soft); border-radius: var(--r-sm); }
  .pa-panel-table { width: 100%; min-width: 380px; border-collapse: collapse; font-size: 12.5px; }
  .pa-panel-table thead th { text-align: left; padding: 10px 12px; font-size: 10.2px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-700); background: var(--surface-sunken); border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .pa-panel-table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; color: var(--ink-900); }
  .pa-panel-table tbody tr:last-child td { border-bottom: none; }
  .pa-panel-name { font-weight: 700; color: var(--ink-900); }
  .pa-panel-reason { color: var(--ink-700); font-weight: 500; }
  .pa-panel-muted { color: var(--ink-faint); font-weight: 600; font-size: 11.8px; }
  .pa-panel-empty { padding: 14px 2px; }
  .pa-panel-empty .pa-empty { padding: 0; }

  /* --- Current Recommendations rows that have a detail modal (Phase
     3A). Only rows with a modal (data-rec-type set by recommendations.js)
     get the pointer cursor / hover / clickable arrow button; rows without
     one keep the original static arrow untouched. --- */
  .pa-cr-row-active { cursor: pointer; transition: background 0.12s ease; }
  .pa-cr-row-active:hover { background: var(--surface-sunken); }
  .pa-cr-arrow-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: none; background: transparent; color: var(--ink-faint); border-radius: var(--r-sm); font-size: 12px; cursor: pointer; transition: color 0.12s ease, background 0.12s ease; }
  .pa-cr-arrow-btn:hover { color: var(--teal-700); background: var(--surface-card); }
  .pa-cr-arrow-btn:focus-visible { outline: 2px solid var(--teal-400); outline-offset: 2px; }

  /* --- Recommendation detail modal — built on the shared
     .modal-overlay/.modal-box/.modal-head/.modal-title/.modal-close/
     .modal-footer/.btn/.status-badge classes from style.css; everything
     below is only the page-specific body layout inside that shared
     shell (same approach inventory.html uses for its own modals). --- */
  #rec-modal-overlay .modal-box.pa-rmodal-box { max-width: 660px; }
  #rec-modal-overlay .pa-rmodal-head { align-items: flex-start; gap: 14px; }
  .pa-rmodal-head-main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .pa-rmodal-icon { flex: none; width: 40px; height: 40px; border-radius: var(--r-sm); background: var(--teal-50); color: var(--teal-700); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .pa-rmodal-desc { margin: 4px 0 0; font-size: 12.5px; font-weight: 500; color: var(--ink-700); line-height: 1.5; }

  .pa-rmodal-body { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
  .pa-rmodal-section { background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 14px 16px; }
  .pa-rmodal-section-title { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-800); display: flex; align-items: center; gap: 8px; }
  .pa-rmodal-section-title i { color: var(--teal-700); font-size: 12px; }
  .pa-rmodal-text { margin: 0; font-size: 12.8px; font-weight: 500; color: var(--ink-700); line-height: 1.55; }
  .pa-rmodal-text + .pa-rmodal-text { margin-top: 6px; }

  .pa-rmodal-metrics { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
  .pa-rmodal-metric dt { margin: 0 0 4px; font-size: 10.8px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-rmodal-metric dd { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--ink-900); overflow-wrap: anywhere; }
  .pa-rmodal-trend { display: inline-flex; align-items: center; gap: 6px; }

  .pa-rmodal-compare { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pa-rmodal-compare-col { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; background: var(--surface-card); border: 1px solid var(--line-soft); border-radius: var(--r-sm); min-width: 100px; }
  .pa-rmodal-compare-label { font-size: 10.6px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; }
  .pa-rmodal-compare-value { font-size: 22px; font-weight: 800; color: var(--ink-900); line-height: 1.2; }
  .pa-rmodal-compare-unit { font-size: 11px; font-weight: 600; color: var(--ink-700); }
  .pa-rmodal-compare-arrow { color: var(--ink-faint); font-size: 14px; }
  .pa-rmodal-compare-note { flex: 1 1 180px; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--teal-50); border-radius: var(--r-sm); font-size: 12px; font-weight: 700; color: var(--teal-700); line-height: 1.4; }

  .pa-rmodal-env { display: flex; flex-direction: column; gap: 6px; }
  .pa-rmodal-env-note { color: var(--ink-800); font-weight: 600; }
  .pa-rmodal-env-nodata { flex-direction: row; align-items: flex-start; gap: 10px; }
  .pa-rmodal-env-nodata i { color: var(--ink-faint); margin-top: 2px; }

  .pa-rmodal-action { display: flex; align-items: flex-start; gap: 10px; }
  .pa-rmodal-action i { flex: none; margin-top: 2px; color: var(--sage-600); font-size: 13px; }

  .pa-rmodal-limitation { display: flex; align-items: flex-start; gap: 10px; }
  .pa-rmodal-limitation i { flex: none; margin-top: 2px; color: var(--ink-faint); font-size: 13px; }
  .pa-rmodal-limitation-low i { color: var(--red-600); }

  /* --- Data Needed / Recording Checklist / Improvement flow
     (INSUFFICIENT_MEDICAL_HISTORY modal, Phase 3B) --- */
  .pa-rmodal-hint { margin-bottom: 12px; color: var(--ink-faint); font-weight: 600; font-size: 12px; }

  .pa-rmodal-checklist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pa-rmodal-checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--surface-card); border: 1px solid var(--line-soft); border-radius: var(--r-sm); }
  .pa-rmodal-checklist-icon { flex: none; width: 26px; height: 26px; border-radius: var(--r-sm); background: var(--teal-50); color: var(--teal-700); display: flex; align-items: center; justify-content: center; font-size: 11.5px; }
  .pa-rmodal-checklist-title { font-size: 12.5px; font-weight: 800; color: var(--ink-900); line-height: 1.35; }
  .pa-rmodal-checklist-desc { margin-top: 2px; font-size: 11.8px; font-weight: 500; color: var(--ink-700); line-height: 1.45; }

  .pa-rmodal-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .pa-rmodal-flow-step { padding: 7px 12px; background: var(--surface-card); border: 1px solid var(--line-soft); border-radius: var(--r-pill); font-size: 11.6px; font-weight: 700; color: var(--ink-800); }
  .pa-rmodal-flow-arrow { color: var(--ink-faint); font-size: 11px; }
  .pa-rmodal-flow-note { margin-top: 10px; }

  .pa-rmodal-recheck { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .pa-rmodal-recheck-item { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; color: var(--ink-800); }
  .pa-rmodal-recheck-item i { font-size: 6px; color: var(--teal-500); }

  @media (max-width: 560px) {
    .pa-rmodal-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pa-rmodal-compare { flex-direction: column; align-items: stretch; }
    .pa-rmodal-compare-arrow { align-self: center; transform: rotate(90deg); }
    .pa-rmodal-checklist { grid-template-columns: minmax(0, 1fr); }
    .pa-rmodal-recheck { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 380px) {
    .pa-rmodal-metrics { grid-template-columns: minmax(0, 1fr); }
  }

  /* --- Analysis Note --- */
  .pa-note { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); }
  .pa-note i { flex: none; margin-top: 2px; color: var(--teal-700); font-size: 14px; }
  .pa-note-title { margin: 0 0 4px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-800); }
  .pa-note-text { margin: 0; font-size: 12.5px; font-weight: 500; color: var(--ink-700); line-height: 1.55; }

  /* --- Consistency pass: match the finalized Predictive Analytics landing page --- */
  /* Removes the straight divider under the shared topbar (same override as the landing page). */
  .topbar { border-bottom: none; }
  /* Page title typography = landing page title. */
  .pa-page-title { margin: 0 0 2px; font-size: 20px; font-weight: 800; line-height: inherit; letter-spacing: normal; color: var(--ink-900); }

  /* --- Consistency pass (part 2): Analysis Controls + Back link, shared with the landing page --- */
  /* Back to Predictive Analytics — one shared control for all four dedicated pages.
     Same pill language as the landing page's View buttons (.pa-view-link). The row's
     22px top margin mirrors the landing page title's offset. */
  .pa-back-row { margin: 22px 0 12px; }
  .pa-back-link { display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; padding: 7px 14px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-pill); color: var(--ink-800); font: inherit; font-size: 12.5px; font-weight: 700; line-height: 1.3; text-decoration: none; white-space: nowrap; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease; }
  .pa-back-link:hover { border-color: var(--teal-400); color: var(--teal-700); }
  .pa-back-link:focus-visible { outline: none; border-color: var(--teal-400); box-shadow: 0 0 0 3px var(--teal-100); }
  .pa-back-link i { font-size: 11px; }

  /* Analysis Controls — copied from predictive-analytics.html */
  .pa-controls { margin-bottom: 30px; }
  .pa-controls-heading { margin: 0 0 18px; font-size: 20px; font-weight: 800; line-height: normal; letter-spacing: normal; color: var(--ink-800); }
  .pa-controls-panel { box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding: 16px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  .pa-controls-field, .pa-controls-status { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pa-controls-label { font-size: 12px; font-weight: 700; color: var(--ink-700); line-height: 1.3; }
  .pa-controls-select { box-sizing: border-box; height: 38px; min-width: 200px; max-width: 100%; }
  .pa-controls-actions { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; min-width: 0; }
  .pa-controls-value { display: flex; align-items: center; min-height: 38px; font-size: 13px; font-weight: 500; color: var(--ink-700); overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .pa-controls-panel { flex-direction: column; align-items: stretch; }
    .pa-controls-select { width: 100%; min-width: 0; }
    .pa-controls-actions { flex-direction: column; align-items: stretch; gap: 16px; }
    .pa-controls-value { min-height: 0; }
  }

  /* Analysis Period select — interactive control on the sunken panel */
  .pa-controls-select {
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    padding: 0 38px 0 12px;
    background-color: var(--surface-card-raised);
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 19px) center, calc(100% - 14px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    box-shadow: var(--clay-flat);
    color: var(--ink-900);
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .pa-controls-select:hover { border-color: var(--teal-400); }
  .pa-controls-select:focus,
  .pa-controls-select:focus-visible {
    background-color: var(--surface-card-raised);
    background-image: linear-gradient(45deg, transparent 50%, var(--teal-600) 50%), linear-gradient(135deg, var(--teal-600) 50%, transparent 50%);
    background-position: calc(100% - 19px) center, calc(100% - 14px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border-color: var(--teal-400);
    box-shadow: 0 0 0 3px var(--teal-100);
    outline: none;
  }
  .pa-controls-select[disabled] { opacity: 0.7; cursor: not-allowed; }
  .pa-controls-select[disabled]:hover { border-color: var(--line-strong); }

</style>
</head>

          <div class="brand-role">Administrator</div>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
      <div class="nav-group">
        <div class="nav-group-label">MAIN</div>
        <a href="dashboard.html" class="nav-item" data-page="dashboard.html">

          <span class="nav-label">Dashboard</span>
        </a>
        <a href="appointments.html" class="nav-item" data-page="appointments.html">
          <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
          <span class="nav-label">Appointments</span>
        </a>
        <a href="queue.html" class="nav-item" data-page="queue.html">

          <span class="nav-label">Queue</span>
        </a>

      <div class="nav-group">
        <div class="nav-group-label">PATIENT MANAGEMENT</div>

          <span class="nav-label">Patients</span>
        </a>
        <a href="clients.html" class="nav-item" data-page="clients.html">
          <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
          <span class="nav-label">Clients</span>
        </a>
        <a href="medical-records.html" class="nav-item" data-page="medical-records.html">
          <span class="nav-icon"><i class="fa-solid fa-notes-medical"></i></span>
          <span class="nav-label">Medical Records</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">CLINIC</div>
        <a href="services.html" class="nav-item" data-page="services.html">
          <span class="nav-icon"><i class="fa-solid fa-hospital"></i></span>
          <span class="nav-label">Services</span>
        </a>
        <a href="inventory.html" class="nav-item" data-page="inventory.html">
          <span class="nav-icon"><i class="fa-solid fa-boxes-stacked"></i></span>
          <span class="nav-label">Inventory</span>
