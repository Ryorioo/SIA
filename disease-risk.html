<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disease Risk Predictions · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Disease Risk Analysis — page-scoped styles (dr- prefix).
     Structure follows the Disease Risk screenshot; every color, border,
     shadow, radius and typography value uses the existing style.css
     tokens so the page matches the rest of Pawsitive Care. */

  .dr-title { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: 0.01em; color: var(--ink-900); }
  .dr-section { margin-bottom: 24px; }
  .dr-section-heading { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }
  .dr-weather-note { display: flex; align-items: center; gap: 6px; margin: -4px 0 12px; font-size: 12px; font-weight: 500; color: var(--ink-700); }
  .dr-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dr-empty-panel { padding: 16px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); font-size: 13px; color: var(--ink-700); }

  /* Disease cards: two-column grid, "Other" full width */
  .dr-card-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .dr-card { box-sizing: border-box; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  .dr-card-wide { grid-column: 1 / -1; }
  .dr-card-nodata { background: var(--surface-sunken); }
  .dr-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .dr-card-id { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .dr-card-icon { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 30px; height: 30px; border-radius: var(--r-xs); background: var(--surface-sunken); color: var(--teal-700); font-size: 14px; }
  .dr-card-title { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.3; color: var(--ink-900); overflow-wrap: anywhere; }
  .dr-card-side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-left: auto; }
  .dr-trend { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-700); }
  .dr-trend i { font-size: 12px; color: var(--ink-soft); }
  .dr-records { font-size: 11.5px; font-weight: 500; color: var(--ink-700); }
  .dr-badge-nodata { display: inline-flex; align-items: center; padding: 2px 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-700); background: transparent; border: 1px solid var(--line-strong); border-radius: var(--r-xs); white-space: nowrap; }
  .dr-nodata-pill { display: inline-flex; padding: 2px 8px; font-size: 11px; font-weight: 600; color: var(--ink-700); background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-xs); }
  .dr-none { color: var(--ink-soft); font-weight: 600; }

  /* Card body: metrics (left) + explanation/environment (right) */
  .dr-card-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: stretch; }
  .dr-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 0; padding: 0; }
  .dr-metric { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 0 12px; border-left: 1px solid var(--line-soft); }
  .dr-metric:first-child { padding-left: 0; border-left: none; }
  .dr-metric dt { font-size: 11.5px; font-weight: 700; color: var(--ink-700); }
  .dr-metric dd { margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 700; color: var(--ink-800); }
  .dr-metric-value { font-size: 15px; font-weight: 800; color: var(--ink-900); overflow-wrap: anywhere; }
  .dr-metric-sub { font-size: 11px; font-weight: 500; color: var(--ink-700); }
  .dr-card-detail { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; padding-left: 16px; border-left: 1px solid var(--line-soft); }
  .dr-card-reason { margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.5; color: var(--ink-800); }
  .dr-env { padding: 8px 10px; background: var(--surface-sunken); border-radius: var(--r-xs); }
  .dr-env-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-700); margin-bottom: 3px; }
  .dr-env p { margin: 0; font-size: 12px; font-weight: 500; line-height: 1.45; color: var(--ink-700); }

  /* Bottom row: trend comparison + data confidence side by side */
  .dr-bottom-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
  .dr-panel { box-sizing: border-box; min-width: 0; padding: 16px 18px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  .dr-panel-heading { margin: 0 0 14px; font-size: 16px; font-weight: 800; line-height: normal; letter-spacing: normal; text-transform: none; color: var(--ink-800); }
  .dr-panel-foot { margin: 12px 0 0; font-size: 11.5px; font-weight: 500; color: var(--ink-700); }
  .dr-table-wrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: var(--r-xs); }
  .dr-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .dr-table th, .dr-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .dr-table th { font-size: 11.5px; font-weight: 700; color: var(--ink-700); background: var(--surface-sunken); }
  .dr-table td { font-weight: 600; color: var(--ink-800); }
  .dr-table tbody tr:last-child td { border-bottom: none; }
  .dr-table .dr-trend { font-size: 12px; }
  .dr-conf-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .dr-conf-tile { box-sizing: border-box; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-xs); }
  .dr-conf-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .dr-conf-label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-800); overflow-wrap: anywhere; }
  .dr-conf-sub { font-size: 11px; font-weight: 500; color: var(--ink-700); }
  .dr-conf-value { margin-top: 8px; font-size: 22px; font-weight: 800; color: var(--ink-900); line-height: 1.1; }
  .dr-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .dr-dot-high { background: var(--teal-700); }
  .dr-dot-medium { background: #d99a2b; }
  .dr-dot-low { background: #d0574b; }
  .dr-dot-none { background: transparent; border: 1.5px solid var(--ink-soft); }

  /* Analysis note */
  .dr-note { padding: 14px 18px; background: var(--surface-sunken); border: 1px solid var(--line-soft); border-radius: var(--r-md); }
  .dr-note-heading { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--ink-800); }
  .dr-note-heading i { color: var(--teal-700); margin-right: 4px; }
  .dr-note p { margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.55; color: var(--ink-700); }

  /* Responsive */
  @media (max-width: 1100px) {
    .dr-bottom-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 820px) {
    .dr-card-grid { grid-template-columns: minmax(0, 1fr); }
    .dr-card-body { grid-template-columns: minmax(0, 1fr); }
    .dr-card-detail { padding-left: 0; border-left: none; }
    .dr-card-side { margin-left: 0; }
  }
  @media (max-width: 640px) {
    .dr-conf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dr-title { font-size: 19px; }
    .dr-metrics { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .dr-metric, .dr-metric:first-child { padding: 0; border-left: none; }
  }

  /* --- Consistency pass: match the finalized Predictive Analytics landing page --- */
  /* Removes the straight divider under the shared topbar (same override as the landing page). */
  .topbar { border-bottom: none; }
  /* Page title typography = landing page title. */
  .dr-title { margin: 0 0 2px; font-size: 20px; font-weight: 800; line-height: inherit; letter-spacing: normal; color: var(--ink-900); }
  @media (max-width: 640px) { .dr-title { font-size: 20px; } }

  /* --- Focused detail page: surface + header, matching the Predictive Analytics Overview --- */
  /* Shared .topbar only holds the hamburger, hidden above 980px; collapse the empty bar on desktop (same as the Overview). */
  @media (min-width: 981px) { .topbar { display: none; } }
  /* Header: title only, same 30px gap to the content as the Overview header. */
  .dr-page-header { margin-bottom: 30px; }
  /* One outer analysis surface (same treatment as the Overview's Disease Risk / Medicine modules). */
  .dr-section { box-sizing: border-box; min-width: 0; padding: 16px 18px 18px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--clay-flat); }
  /* Condition cards become inner content surfaces (page-bg tone, hairline border, faint inset) instead of raised cards. */
  .dr-card { background: var(--surface-bg); box-shadow: inset 0 1px 2px rgba(31, 42, 46, 0.05); }
  .dr-card-nodata { background: var(--surface-sunken); }
  /* Bottom panels share the module padding. */
  .dr-panel { padding: 16px 18px 18px; }
  /* The outer surface narrows each condition card by ~38px, so below 1500px stack the metrics above the explanation
     in the two-column grid cards (the full-width "Other" card keeps its side-by-side body), and use one column
     of cards at 1100px and below, so Risk / Trend / Confidence values never break mid-word. */
  @media (max-width: 1500px) {
    .dr-card:not(.dr-card-wide) .dr-card-body { grid-template-columns: minmax(0, 1fr); }
    .dr-card:not(.dr-card-wide) .dr-card-detail { padding-left: 0; border-left: none; }
  }
  @media (max-width: 1100px) { .dr-card-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
