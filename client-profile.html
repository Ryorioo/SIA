<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Profile · Pawsitive Care</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     CLIENT PROFILE PAGE — page-scoped styles only (style.css
     untouched). Reuses the existing design tokens.
     ============================================================ */
  .topbar { border-bottom: none; }
  .page-body { overflow-x: clip; }

  /* quiet ghost/pill "go back" navigation control */
  .pp-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: var(--r-pill);
    background: var(--sage-50); color: var(--teal-700);
    font-size: 12.5px; font-weight: 700; line-height: 1.4;
    margin-bottom: 10px; transition: background-color 0.15s ease, color 0.15s ease;
  }
  .pp-back i { font-size: 11px; }
  .pp-back:hover { background: var(--sage-100); color: var(--teal-800); }
  .pp-title { font-size: 20px; font-weight: 800; color: var(--ink-900); letter-spacing: -0.01em; margin-bottom: 16px; }

  /* shared panel surface */
  .pp-panel {
    background: var(--surface-card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--clay-flat);
    padding: 20px 22px;
    min-width: 0;
  }
  .pp-panel-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 14.2px; font-weight: 800; color: var(--ink-900);
    margin-bottom: 16px;
  }
  .pp-panel-title i { color: var(--teal-600); font-size: 13.5px; }

  /* ---------- patient header ---------- */
  .pp-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px 24px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .pp-identity { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .pp-photo {
    width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
    background: var(--surface-sunken);
    border: 1px solid var(--line-strong);
    box-shadow: var(--clay-pressed);
    display: flex; align-items: center; justify-content: center;
    color: var(--teal-600); font-size: 34px;
  }
  .pp-id-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pp-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pp-name { font-size: 26px; font-weight: 800; color: var(--teal-700); line-height: 1.15; overflow-wrap: anywhere; }
  .pp-pid {
    font-size: 11.5px; font-weight: 700; color: var(--teal-700);
    background: var(--surface-card-raised); border: 1px solid var(--line-soft);
    padding: 3px 8px; border-radius: 6px;
  }
  .pp-species { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  
  

  .pp-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  /* ---------- overview cards ---------- */
  

  .pp-field { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .pp-field > i { color: var(--ink-faint); font-size: 14px; width: 18px; text-align: center; margin-top: 3px; flex-shrink: 0; }
  .pp-flabel { font-size: 11px; font-weight: 700; color: var(--ink-faint); }
  .pp-fvalue { font-size: 13.2px; font-weight: 600; color: var(--ink-800); overflow-wrap: anywhere; }

  
  

  
  
  

  /* ---------- history tabs ---------- */
  .pp-tabs {
    display: flex; gap: 2px; overflow-x: auto;
    padding-bottom: 1px; /* room for the tabs' -1px margin-bottom, which otherwise overflows the box by 1px and triggers a vertical scrollbar */
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
    scrollbar-width: thin;
  }
  .pp-tab {
    border: none; background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 11px 18px; margin-bottom: -1px;
    font-weight: 700; font-size: 13px; color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .pp-tab i { font-size: 13px; }
  .pp-tab:hover { color: var(--teal-700); }
  .pp-tab.active { color: var(--teal-700); background: var(--surface-card); border-bottom-color: var(--teal-600); }

  .pp-main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }

  /* ---------- tables ---------- */
  .pp-table-wrap { overflow-x: auto; }
  .pp-table { width: 100%; border-collapse: collapse; }
  .pp-table th {
    text-align: left; font-size: 11.2px; font-weight: 800; letter-spacing: 0.03em;
    color: var(--ink-faint); background: var(--surface-sunken);
    padding: 10px 14px; white-space: nowrap;
  }
  .pp-table th:first-child { border-radius: var(--r-xs) 0 0 var(--r-xs); }
  .pp-table th:last-child  { border-radius: 0 var(--r-xs) var(--r-xs) 0; }
  .pp-table td {
    padding: 13px 14px; font-size: 12.8px; font-weight: 500; color: var(--ink-800);
    border-bottom: 1px solid var(--line-soft); vertical-align: middle;
  }
  .pp-table tbody tr:last-child td { border-bottom: none; }
  .pp-empty { text-align: center; padding: 30px 12px; color: var(--ink-faint); font-weight: 600; font-size: 13px; }

  /* ---------- recent activity timeline ---------- */
  .pp-timeline { display: flex; flex-direction: column; }
  .pp-tl-item { position: relative; padding: 0 0 18px 24px; }
  .pp-tl-item:last-child { padding-bottom: 0; }
  .pp-tl-item::before {
    content: ''; position: absolute; left: 4px; top: 14px; bottom: -2px;
    width: 1.5px; background: var(--line);
  }
  .pp-tl-item:last-child::before { display: none; }
  .pp-tl-dot {
    position: absolute; left: 0; top: 5px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--slate-600);
  }
  .pp-tl-date { font-size: 12.5px; font-weight: 800; color: var(--ink-900); }
  .pp-tl-text { font-size: 12.8px; font-weight: 500; color: var(--ink-700); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .pp-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill); }
  .tone-vaccination { background: var(--sage-100); color: var(--sage-600); }
  .tone-consultation { background: var(--teal-100); color: var(--teal-700); }
  .tone-treatment { background: var(--amber-100); color: var(--amber-800); }
  .tone-other { background: var(--slate-100); color: var(--slate-800); }
  .pp-tl-item.tone-vaccination-dot .pp-tl-dot { background: var(--sage-500); }
  .pp-tl-item.tone-consultation-dot .pp-tl-dot { background: var(--teal-500); }
  .pp-tl-item.tone-treatment-dot .pp-tl-dot { background: var(--amber-600); }

  /* ---------- not found ---------- */
  .pp-missing { text-align: center; padding: 56px 20px; }
  .pp-missing h2 { font-size: 17px; margin-bottom: 6px; }
  .pp-missing p { color: var(--ink-soft); font-weight: 500; margin-bottom: 16px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1180px) {
    .pp-main { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .pp-actions { justify-content: flex-start; }
    .pp-panel { padding: 16px; }
  }
  @media (max-width: 640px) {
    .pp-photo { width: 76px; height: 76px; font-size: 28px; }
    .pp-name { font-size: 22px; }
    .pp-identity { gap: 14px; }
    /* medical table → stacked rows so nothing needs to scroll sideways */
    .pp-table.stackable thead { display: none; }
    .pp-table.stackable, .pp-table.stackable tbody, .pp-table.stackable tr, .pp-table.stackable td { display: block; width: 100%; }
    .pp-table.stackable tr { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .pp-table.stackable tbody tr:last-child { border-bottom: none; }
    .pp-table.stackable td { border: none; padding: 3px 4px; display: flex; gap: 12px; justify-content: space-between; }
    .pp-table.stackable td::before { content: attr(data-label); font-size: 11px; font-weight: 800; color: var(--ink-faint); flex-shrink: 0; }
  }
  @media (max-width: 420px) {
    .pp-actions .btn { flex: 1 1 100%; }
    .pp-tab { padding: 10px 13px; }
  }

  /* ---------- client-specific additions (same tokens/patterns) ---------- */
  .status-active   { background: var(--sage-100); color: var(--sage-600); }
  .status-inactive { background: var(--slate-100); color: var(--slate-800); }

  .pp-header .pp-photo { color: var(--ink-soft); }
  .pp-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .pp-actions .btn-plain { background: var(--surface-card-raised); }

  /* client details: three columns separated by thin rules */
  .cl-details { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cl-col { display: flex; flex-direction: column; gap: 18px; padding: 0 24px; min-width: 0; }
  .cl-col:first-child { padding-left: 0; }
  .cl-col:last-child { padding-right: 0; }
  .cl-col + .cl-col { border-left: 1px solid var(--line-soft); }

  /* registered pets */
  .pp-section-title { font-size: 15px; font-weight: 800; color: var(--ink-900); letter-spacing: 0.01em; margin: 24px 0 12px; }
  .cl-pets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  .cl-pet {
    background: var(--surface-sunken); border: 1px solid var(--line-soft);
    border-radius: var(--r-lg); box-shadow: var(--clay-flat);
    padding: 14px 18px; display: flex; align-items: center; gap: 16px; min-width: 0;
  }
  .cl-pet-photo {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; align-self: flex-start;
    background: var(--surface-card) center / cover no-repeat;
    border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    color: var(--teal-600); font-size: 22px;
  }
  .cl-pet-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .cl-pet-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
  .cl-pet-head .cl-pet-tag { align-self: center; }
  .cl-pet-name { font-size: 16px; font-weight: 800; color: var(--teal-700); overflow-wrap: anywhere; }
  .cl-pet-tag { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill); background: var(--teal-100); color: var(--teal-700); }
  .cl-pet-line { font-size: 12.6px; color: var(--ink-soft); font-weight: 600; overflow-wrap: anywhere; }
  .cl-pet-line b { color: var(--ink-900); font-weight: 700; }
  /* Gender row: label left, View Pet Profile right, same line. Negative vertical margins keep the
     button from adding height beyond the normal text line (no dead row, no footer). */
  .cl-pet-gender { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 10px; }
  .cl-pet-gender > span { min-width: 0; }
  .cl-pet-btn { flex-shrink: 0; margin: -7px 0; }
  .cl-pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin: -4px 0 20px; }
  .cl-pager-info { font-size: 12.6px; font-weight: 700; color: var(--ink-soft); min-width: 44px; text-align: center; }
  .cl-pager .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .cl-pets-empty { grid-column: 1 / -1; text-align: center; padding: 26px 12px; color: var(--ink-faint); font-weight: 600; font-size: 13px; background: var(--surface-card); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); }

  /* pet cell inside tables */
  .cl-petcell { display: inline-flex; align-items: center; gap: 9px; }
  .cl-petdot { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; background: var(--surface-sunken) center / cover no-repeat; border: 1px solid var(--line-soft); display: inline-flex; align-items: center; justify-content: center; color: var(--teal-600); font-size: 11px; }

  @media (max-width: 1180px) {
    .cl-details { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; }
    .cl-col:nth-child(2) { padding-right: 0; }
    .cl-col:nth-child(3) { border-left: none; padding-left: 0; grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 18px 48px; }
  }
  @media (max-width: 760px) {
    .cl-details { grid-template-columns: 1fr; }
    .cl-col, .cl-col:first-child, .cl-col:last-child, .cl-col:nth-child(2), .cl-col:nth-child(3) { padding: 0; border-left: none; }
    .cl-col + .cl-col { border-top: 1px solid var(--line-soft); padding-top: 18px; margin-top: 0; }
    .cl-col:nth-child(3) { flex-direction: column; gap: 18px; }
    .cl-details { row-gap: 18px; }
    .cl-pets { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .cl-pet { flex-direction: column; align-items: flex-start; }
    .cl-pet-body { align-self: stretch; }
  }
</style>
</head>
